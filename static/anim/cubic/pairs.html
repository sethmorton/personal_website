<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f7f4ec; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; display: block; }
  .cap { display: none; }
</style>
</head>
<body>
<div>
<canvas id="c"></canvas>
<div class="cap">Every new token reopens every relationship. One squared check after another adds up to n cubed.</div>
</div>
<script>
const W = 640, H = 400, DPR = 2;
const c = document.getElementById('c'); c.width = W * DPR; c.height = H * DPR;
const g = c.getContext('2d'); g.scale(DPR, DPR);

const INK = [40,97,122], DEEP = [35,72,95], SKY = [113,146,158], PALE = [155,173,176];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const mix = (a, b, t) => `rgb(${a[0] + (b[0] - a[0]) * t | 0},${a[1] + (b[1] - a[1]) * t | 0},${a[2] + (b[2] - a[2]) * t | 0})`;
const ramp = (a, b) => { const r = []; for (let i = 0; i <= 8; i++) r.push(mix(a, b, i / 8)); return r; };
const ease = p => p <= 0 ? 0 : p >= 1 ? 1 : p * p * (3 - 2 * p);
const lvl = w => w <= 0 ? 0 : w >= 1 ? 8 : (w * 8 + 0.5) | 0;
const PALE_DEEP = ramp(PALE, DEEP), SKY_DEEP = ramp(SKY, DEEP), DEEP_INK = ramp(DEEP, INK), SKY_INK = ramp(SKY, INK);

// ---- timeline: nine arrivals, each an arrival plus one sweep through every spring; hold; fade; loop ----
const N = 9, STEP = 0.95, HOLD = 2, FADE = 1, PERIOD = N * STEP + HOLD + FADE;
let T = 0, dots = 0, cur = '';
const fill = s => { if (s !== cur) g.fillStyle = cur = s; };
const dot = (x, y, s, q) => { g.fillRect(x + Math.sin(T * 1.4 + q) * 0.5 - s / 2, y + Math.cos(T * 1.1 + q * 1.7) * 0.5 - s / 2, s, s); dots++; };
function dotLine(x0, y0, x1, y1, sz, q) {
  const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 3.5));
  for (let k = 0; k <= n; k++) { const t = k / n; dot(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, sz, q + k); }
}

// ---- blocks on a gentle arc: 4x4 squares of walking dots that gather out of scatter ----
const bx = new Float32Array(N), by = new Float32Array(N), OFF = [-6, -2, 2, 6];
for (let i = 0; i < N; i++) { bx[i] = 66 + i * 50; by[i] = 226 - Math.sin(Math.PI * i / (N - 1)) * 10; }
const scx = new Float32Array(N * 16), scy = new Float32Array(N * 16);
for (let i = 0; i < N * 16; i++) { const a = rnd() * 6.28, r = 16 + rnd() * 22; scx[i] = Math.cos(a) * r; scy[i] = Math.sin(a) * r; }
function blocks(step, st) {
  for (let i = 0; i <= step; i++) {
    const arr = i === step ? ease(st / 0.3) : 1, cool = i === step ? ease((st - 0.35) / 0.6) : 1;
    fill(arr < 1 ? SKY_DEEP[lvl(arr)] : DEEP_INK[lvl(cool)]);
    for (let m = 0; m < 16; m++) dot(bx[i] + OFF[m & 3] + scx[i * 16 + m] * (1 - arr), by[i] + OFF[m >> 2] + scy[i * 16 + m] * (1 - arr), 2.1, i * 16 + m);
  }
}

// ---- springs: every pair as a zigzag arc; each step ranks them by distance from the newest block, then by length ----
const NS = N * (N - 1) / 2, sa = new Uint8Array(NS), sb = new Uint8Array(NS);
{ let s = 0; for (let b = 1; b < N; b++) for (let a = 0; a < b; a++) { sa[s] = a; sb[s] = b; s++; } }
const rank = new Uint8Array(N * NS), cnt = new Uint8Array(N);
for (let nb = 1; nb < N; nb++) { let r = 0;
  for (let key = 0; key < N * N; key++) for (let s = 0; s < NS; s++)
    if (sb[s] <= nb && (nb - sb[s]) * N + sb[s] - sa[s] === key) rank[nb * NS + s] = r++;
  cnt[nb] = r; }
const SWEEP0 = 0.22, SWEEP = 0.45;                       // sweep begins once the block has landed, spreads over 0.45 s
const pulsePos = (s, nb, st) => nb < 1 || sb[s] > nb ? -9 : (st - SWEEP0 - rank[nb * NS + s] / cnt[nb] * SWEEP) / (0.18 + (sb[s] - sa[s]) * 0.03);
function spring(s, step, st) {
  const a = sa[s], b = sb[s], x0 = bx[a], y0 = by[a], x1 = bx[b], y1 = by[b], h = 6 + (b - a) * 16;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 - 2 * h, chord = x1 - x0;
  const n = Math.round(Math.hypot(chord, 2.2 * h) / 3.4), zig = n / 2.4 | 0, grow = b === step ? ease(st / SWEEP0) : 1;
  const p = pulsePos(s, step, st), pp = pulsePos(s, step - 1, st + STEP), hw = n / 6;
  for (let k = n; k >= 0; k--) {
    const t = k / n, u = 1 - t, v = u; if (v > grow) break;                 // a new spring grows out of the newest block
    const tx = u * (cx - x0) + t * (x1 - cx), ty = u * (cy - y0) + t * (y1 - cy), tl = Math.hypot(tx, ty);
    const amp = 3 * Math.min(1, t * 10, u * 10), z = t * zig, tri = Math.abs(z - Math.floor(z) - 0.5) * 4 - 1;
    const x = u * u * x0 + 2 * u * t * cx + t * t * x1 - ty / tl * amp * tri, y = u * u * y0 + 2 * u * t * cy + t * t * y1 + tx / tl * amp * tri;
    let w = 1 - Math.abs(p - v) * hw; if (v < p) w = Math.max(w, 0.45 * (1 - (p - v) * 1.8));
    let w2 = 1 - Math.abs(pp - v) * hw; if (v < pp) w2 = Math.max(w2, 0.45 * (1 - (pp - v) * 1.8)); if (w2 > w) w = w2;
    fill(PALE_DEEP[lvl(w)]); dot(x, y, 1.5 + Math.max(0, w) * 1.5, s * 7 + k);
  }
}

// ---- the count: bar k is k^2 units of ink, the pale curve is the running total 1^2 + ... + k^2 ----
const S = new Float32Array(N + 1); for (let k = 1; k <= N; k++) S[k] = S[k - 1] + k * k;
const BASE = 372, BH = 120, sqTxt = [], totTxt = [];
for (let k = 1; k <= N; k++) { sqTxt.push('= ' + k * k); totTxt.push('= ' + S[k]); }
function bars(step, st) {
  fill(PALE_DEEP[0]); dotLine(bx[0] - 12, BASE + 3, bx[N - 1] + 12, BASE + 3, 1.5, 900);
  const f = ease((st - 0.2) / 0.65);
  for (let k = 1; k <= step + 1; k++) {
    const rows = Math.max(1, Math.round(k * k * BH / 81 / 3)), shown = k === step + 1 ? Math.ceil(rows * f) : rows;
    fill(DEEP_INK[k === step + 1 ? lvl(f) : 8]);
    for (let r = 0; r < shown; r++) for (let col = 0; col < 5; col++) dot(bx[k - 1] - 6.4 + col * 3.2, BASE - r * 3, 1.8, k * 31 + r * 5 + col);
  }
  fill(PALE_DEEP[0]);
  let x0 = bx[0] - 12, y0 = BASE;
  for (let k = 1; k <= step + 1; k++) {
    const y1 = BASE - (k === step + 1 ? S[k - 1] + (S[k] - S[k - 1]) * f : S[k]) / S[N] * BH, x1 = bx[k - 1];
    dotLine(x0, y0, x1, y1, 2, 1000 + k * 40); x0 = x1; y0 = y1;
  }
  g.textAlign = 'left';
  g.fillText('checks this step: k²', 492, 296); g.fillText(sqTxt[step], 492, 311);
  g.fillText('total: ~n³', 492, 340); g.fillText(totTxt[step], 492, 355);
}

// ---- the foil: autoregression, one spring per step ----
function mini(step, st) {
  const X0 = 32, Y = 40, GAP = 22;
  for (let i = 0; i <= step; i++) {
    fill(SKY_INK[i === step ? lvl(st / 0.3) : 8]);
    for (let m = 0; m < 9; m++) dot(X0 + i * GAP + (m % 3) * 2.5 - 2.5, Y + (m / 3 | 0) * 2.5 - 2.5, 1.7, 500 + i * 9 + m);
    if (!i) continue;
    const w = i === step ? (st < 0.25 ? 0 : st < 0.6 ? 1 : 1 - (st - 0.6) / 0.35) : 0, x0 = X0 + (i - 1) * GAP + 5;
    fill(PALE_DEEP[lvl(w)]);
    for (let m = 0; m <= 5; m++) { const t = m / 5; dot(x0 + t * (GAP - 10), Y - 20 * t * (1 - t) - 1, 1.5 + w * 0.8, 600 + i * 6 + m); }
  }
  fill(PALE_DEEP[0]); g.textAlign = 'left'; g.fillText('one new state', 26, 66);
  g.textAlign = 'right'; g.fillText('all pairs revisited', 616, 66);
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now; T += dt; if (T >= PERIOD) T -= PERIOD;
  const step = Math.min(N - 1, T / STEP | 0), st = T - step * STEP;
  g.clearRect(0, 0, W, H); dots = 0;
  g.globalAlpha = 1 - ease((T - N * STEP - HOLD) / FADE);
  g.font = '11px ui-monospace, Menlo, monospace';
  for (let s = 0; s < NS; s++) if (sb[s] <= step) spring(s, step, st);
  blocks(step, st); bars(step, st); mini(step, st);
  window.__dots = dots; window.__T = T;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
