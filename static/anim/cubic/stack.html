<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f7f4ec; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; display: block; }
  .cap { display: none; }
</style>
</head>
<body>
<div>
<canvas id="c"></canvas>
<div class="cap">Adding one more token means checking every pair again. The pile grows like a cube.</div>
</div>
<script>
const W = 640, H = 400, DPR = 2;
const c = document.getElementById('c'); c.width = W * DPR; c.height = H * DPR;
const g = c.getContext('2d'); g.scale(DPR, DPR);

const INK = [40,97,122], DEEP = [35,72,95], SKY = [113,146,158], PALE = [155,173,176];
let seed = 5; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const mix = (a, b, t) => `rgb(${a[0] + (b[0] - a[0]) * t | 0},${a[1] + (b[1] - a[1]) * t | 0},${a[2] + (b[2] - a[2]) * t | 0})`;
const ramp = (a, b) => { const r = []; for (let i = 0; i <= 8; i++) r.push(mix(a, b, i / 8)); return r; };
const ease = p => p <= 0 ? 0 : p >= 1 ? 1 : p * p * (3 - 2 * p);
const lvl = w => w <= 0 ? 0 : w >= 1 ? 8 : (w * 8 + 0.5) | 0;
const INK_DEEP = ramp(INK, DEEP), SKY_INK = ramp(SKY, INK), PALE_S = mix(PALE, PALE, 0), INK_S = mix(INK, INK, 0);

// ---- timeline: eight plates, each streams in then rechecks every plate beneath; hold; fade; loop ----
const N = 8, STEP = 1.1, HOLD = 2, FADE = 1, PERIOD = N * STEP + HOLD + FADE;
const STAG = 0.3, FLY = 0.35, ARRIVE = STAG + FLY, FLASH = 0.3, LAG = 0.055;
let T = 0, dots = 0, cur = '';
const fill = s => { if (s !== cur) g.fillStyle = cur = s; };
const dot = (x, y, s, q) => { g.fillRect(x + Math.sin(T * 1.4 + q) * 0.5 - s / 2, y + Math.cos(T * 1.1 + q * 1.7) * 0.5 - s / 2, s, s); dots++; };
function dotLine(x0, y0, x1, y1, sz, q) {
  const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 3.5));
  for (let k = 0; k <= n; k++) { const t = k / n; dot(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, sz, q + k); }
}

// ---- oblique projection: across 12 px, up 21 px, depth a soft (6, -2.6) shear; every plate centred on one axis ----
const OX = 262, OY = 332, SP = 12, PZ = 21, DX = 6, DY = -2.6;
const px = (a, d) => OX + a * SP + d * DX, py = (d, z) => OY - z * PZ + d * DY;

// ---- every token of every plate: where it lands, where it starts off-canvas, the arc between, its turn in the stream ----
const base = new Uint16Array(N + 1); for (let k = 1; k <= N; k++) base[k] = base[k - 1] + k * k;
const NB = base[N];
const dx = new Float32Array(NB), dy = new Float32Array(NB), sx = new Float32Array(NB), sy = new Float32Array(NB);
const cx = new Float32Array(NB), cy = new Float32Array(NB), stg = new Float32Array(NB);
for (let k = 1, m = 0; k <= N; k++) for (let a = k - 1; a >= 0; a--) for (let d = 0; d < k; d++, m++) {
  const h = (k - 1) / 2; dx[m] = px(a - h, d - h); dy[m] = py(d - h, k - 1);
  sx[m] = 690 + rnd() * 60; sy[m] = dy[m] - 150 + rnd() * 120;
  cx[m] = (dx[m] + sx[m]) / 2 + rnd() * 60; cy[m] = Math.min(dy[m], sy[m]) - 20 - rnd() * 70;
  stg[m] = ((k - 1 - a) * k + d) / (k * k) * STAG;
}
// the recheck: once a plate has landed, every plate flashes darker in turn, top to bottom (last step's tail included)
function flash(j, step, st) {
  let w = 0;
  for (let q = 0; q < 2; q++) { const s = step - q; if (s < j) break;
    const f = st + q * STEP - ARRIVE - (s - j) * LAG; if (f >= 0 && f < FLASH) w = Math.max(w, 1 - f / FLASH); }
  return w;
}
function plates(step, st) {
  fill(PALE_S);
  for (let j = 0; j < step; j++) rim(j + 1, j);
  if (st > ARRIVE - 0.1) rim(step + 1, step);
  for (let j = 0; j <= step; j++) {
    const w = flash(j, step, st), col = INK_DEEP[lvl(w)], sz = 2.5 + w * 0.9;
    for (let m = base[j]; m < base[j + 1]; m++) {
      const x = dx[m], y = dy[m];
      if (j === step) {
        const p = ease((st - stg[m]) / FLY); if (p <= 0) continue;
        if (p < 1) {                                   // in flight: a sky comet along its arc, four fading beads behind
          for (let b = 4; b >= 0; b--) { const q = Math.max(0, p - b * 0.035), u = 1 - q;
            fill(b ? SKY_INK[0] : SKY_INK[lvl((p - 0.6) * 2.5)]);
            dot(u * u * sx[m] + 2 * u * q * cx[m] + q * q * dx[m], u * u * sy[m] + 2 * u * q * cy[m] + q * q * dy[m], b ? 1.8 - b * 0.25 : sz, m + b * 300); }
          continue;
        }
      }
      fill(col); dot(x, y, sz, m);
    }
  }
}

// ---- the rim of each landed plate, and the enclosing cube, both dotted pale ----
function rim(k, z) {
  const lo = -k / 2 - 0.05, hi = k / 2 + 0.05, q = 300 + k * 90;
  dotLine(px(lo, lo), py(lo, z), px(hi, lo), py(lo, z), 1.4, q); dotLine(px(hi, lo), py(lo, z), px(hi, hi), py(hi, z), 1.4, q + 20);
  dotLine(px(hi, hi), py(hi, z), px(lo, hi), py(hi, z), 1.4, q + 40); dotLine(px(lo, hi), py(hi, z), px(lo, lo), py(lo, z), 1.4, q + 60);
}
function cube(n) {
  fill(PALE_S);
  const lo = -n / 2 - 0.1, hi = n / 2 + 0.1, zlo = -0.5, zhi = n - 0.5;
  for (let i = 0; i < 4; i++) { const a = i & 1 ? hi : lo, d = i & 2 ? hi : lo, z = i & 2 ? zhi : zlo;
    dotLine(px(a, d), py(d, zlo), px(a, d), py(d, zhi), 1.5, 700 + i * 60);
    dotLine(px(lo, a), py(a, z), px(hi, a), py(a, z), 1.5, 950 + i * 60);
    dotLine(px(a, lo), py(lo, z), px(a, hi), py(hi, z), 1.5, 1200 + i * 60);
  }
}

// ---- the scale: one linear count axis, 0 to 8^3; n, n^2 and n^3 climb at very different speeds; the pile is the ink mark ----
const SX = 520, S0 = 352, S1 = 60, SMAX = N * N * N;
const sh = v => S0 + (S1 - S0) * v / SMAX, ys = new Float32Array(4), txt = [[], [], [], []];
for (let k = 0; k <= N; k++) { txt[0].push('n = ' + k); txt[1].push('n² = ' + k * k); txt[2].push('Σk² = ' + base[k]); txt[3].push('n³ = ' + k * k * k); }
function scale(n, step, st) {
  fill(PALE_S); dotLine(SX, S0, SX, S1, 1.5, 1500);
  for (let k = 1; k <= N; k++) dotLine(SX - 3, sh(k * k * k), SX + 3, sh(k * k * k), 1.3, 1600 + k * 3);     // ticks at each k^3
  const sum = base[step] + (step + 1) * (step + 1) * ease(st / ARRIVE);
  ys[0] = sh(n); ys[1] = sh(n * n); ys[2] = sh(sum); ys[3] = sh(n * n * n);
  for (let i = 0; i < 4; i++) { fill(i === 2 ? INK_S : PALE_S); dotLine(SX - 8, ys[i], SX + 8, ys[i], i === 2 ? 2 : 1.6, 1700 + i * 10); }
  for (let i = 1; i < 4; i++) ys[i] = Math.min(ys[i], ys[i - 1] - 13);                                    // labels stay legible when marks bunch
  const k = st > 0.3 ? step + 1 : step; g.textAlign = 'left';
  for (let i = 0; i < 4; i++) { fill(i === 2 ? INK_S : PALE_S); g.fillText(txt[i][k], SX + 16, ys[i] + 4); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now; T += dt; if (T >= PERIOD) T -= PERIOD;
  const step = Math.min(N - 1, T / STEP | 0), st = T - step * STEP, n = step + ease(st / ARRIVE);
  g.clearRect(0, 0, W, H); dots = 0;
  g.globalAlpha = 1 - ease((T - N * STEP - HOLD) / FADE);
  g.font = '11px ui-monospace, Menlo, monospace';
  cube(n); plates(step, st); scale(n, step, st);
  window.__dots = dots; window.__T = T;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
