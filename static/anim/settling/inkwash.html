<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f7f4ec; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; }
  .cap { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">Move one drop and the boundaries between every neighbouring idea redraw themselves.</div>
<script>
const W = 640, H = 400, DPR = Math.min(2, devicePixelRatio || 1);
const c = document.getElementById('c'); c.width = W * DPR; c.height = H * DPR;
const g = c.getContext('2d'); g.scale(DPR, DPR);
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const INK = 'rgb(74,106,143)', PALE = 'rgb(182,194,210)';
const ISO = 1.8, ISO_OUT = 1.05, CELL = 5, GX = 128, GY = 80, NX = GX + 1, NY = GY + 1;

// metaball sources on a jittered 3x3, joined by weak springs to their 2 nearest
const src = [];
for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++)
  src.push({ x: 140 + i * 180 + (rnd() - 0.5) * 90, y: 95 + j * 105 + (rnd() - 0.5) * 60, vx: 0, vy: 0, fx: 0, fy: 0,
             r: 36 + rnd() * 32, ph: rnd() * 6.28, sx: 0, sy: 0 });
const springs = [], has = new Set();
const link = (i, j) => { const k = i < j ? i * 100 + j : j * 100 + i; if (has.has(k)) return; has.add(k);
  springs.push({ a: i, b: j, L: Math.hypot(src[i].x - src[j].x, src[i].y - src[j].y) }); };
src.forEach((n, i) => {
  const near = src.map((m, j) => [Math.hypot(n.x - m.x, n.y - m.y), j]).filter(p => p[1] !== i).sort((p, q) => p[0] - q[0]);
  link(i, near[0][1]); link(i, near[1][1]);
});

// physics: weak springs, heavy damping, rest lengths creep toward what is (shapes accepted, never restored)
const K = 7, DAMP = 3.2, CREEP = 0.5;
let kicked = -1, kx0 = 0, ky0 = 0, kx1 = 0, ky1 = 0, kT = 9;
function step(dt) {
  for (const n of src) { n.fx = n.fy = 0;
    if (n.x < 70) n.fx += (70 - n.x) * 25; if (n.x > W - 70) n.fx -= (n.x - W + 70) * 25;
    if (n.y < 72) n.fy += (72 - n.y) * 25; if (n.y > H - 72) n.fy -= (n.y - H + 72) * 25; }
  for (const sp of springs) {
    const a = src[sp.a], b = src[sp.b], dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    sp.L += (L - sp.L) * CREEP * dt;
    const f = K * (L - sp.L) / L;
    a.fx += f * dx; a.fy += f * dy; b.fx -= f * dx; b.fy -= f * dy;
  }
  src.forEach((n, i) => {
    if (i === kicked && kT < 3.5) { const u = Math.min(1, kT / 1.5), e = u * u * (3 - 2 * u);
      n.x = kx0 + (kx1 - kx0) * e; n.y = ky0 + (ky1 - ky0) * e; n.vx = n.vy = 0; return; }
    n.vx += (n.fx - DAMP * n.vx) * dt; n.vy += (n.fy - DAMP * n.vy) * dt; n.x += n.vx * dt; n.y += n.vy * dt;
  });
}
function kick() {
  let i; do i = (rnd() * src.length) | 0; while (i === kicked);
  const n = src[i]; kicked = i; kx0 = n.x; ky0 = n.y; kT = 0;
  for (let k = 0; k < 40; k++) { const a = rnd() * 6.28, d = 80 + rnd() * 40; kx1 = n.x + Math.cos(a) * d; ky1 = n.y + Math.sin(a) * d;
    if (kx1 > 85 && kx1 < W - 85 && ky1 > 78 && ky1 < H - 78) break; }
}

// scalar field on a 129x81 lattice, sampled bilinearly for the hatching
const F = new Float32Array(NX * NY), seen = new Uint8Array(NX * NY), stack = new Int32Array(NX * NY);
function field() {
  for (const n of src) { n.sx = n.x + Math.sin(T * 0.23 + n.ph) * 3; n.sy = n.y + Math.cos(T * 0.19 + n.ph * 1.3) * 3; }
  for (let j = 0, q = 0; j < NY; j++) for (let i = 0; i < NX; i++, q++) {
    const x = i * CELL, y = j * CELL; let v = 0;
    for (const n of src) { const dx = x - n.sx, dy = y - n.sy; v += n.r * n.r / (dx * dx + dy * dy + 1); }
    F[q] = v;
  }
}
function sample(x, y) {
  const gx = Math.max(0, Math.min(GX - 0.001, x / CELL)), gy = Math.max(0, Math.min(GY - 0.001, y / CELL));
  const i = gx | 0, j = gy | 0, u = gx - i, v = gy - j, q = j * NX + i;
  return (F[q] * (1 - u) + F[q + 1] * u) * (1 - v) + (F[q + NX] * (1 - u) + F[q + NX + 1] * u) * v;
}
// number of separate blobs (flood fill of lattice points above ISO); a change means a split or a merge
function blobs() {
  seen.fill(0); let count = 0;
  for (let s = 0; s < NX * NY; s++) {
    if (seen[s] || F[s] < ISO) continue; count++; let top = 0; stack[top++] = s; seen[s] = 1;
    while (top) { const q = stack[--top], i = q % NX;
      if (i > 0 && !seen[q - 1] && F[q - 1] >= ISO) { seen[q - 1] = 1; stack[top++] = q - 1; }
      if (i < GX && !seen[q + 1] && F[q + 1] >= ISO) { seen[q + 1] = 1; stack[top++] = q + 1; }
      if (q >= NX && !seen[q - NX] && F[q - NX] >= ISO) { seen[q - NX] = 1; stack[top++] = q - NX; }
      if (q + NX < NX * NY && !seen[q + NX] && F[q + NX] >= ISO) { seen[q + NX] = 1; stack[top++] = q + NX; } }
  }
  return count;
}
// the pinch: the lattice point on the boundary where the field is flattest (a saddle)
function pinch(out) {
  let best = 1e9;
  for (let j = 1; j < GY; j++) for (let i = 1; i < GX; i++) { const q = j * NX + i;
    if (Math.abs(F[q] - ISO) > 0.2) continue;
    const gx = F[q + 1] - F[q - 1], gy = F[q + NX] - F[q - NX], m = gx * gx + gy * gy;
    if (m < best) { best = m; out[0] = i * CELL; out[1] = j * CELL; } }
}

// marching squares, emitted straight to dots every ~3 px with a breathing wobble
const TBL = [[], [3, 0], [0, 1], [3, 1], [1, 2], [3, 0, 1, 2], [0, 2], [3, 2], [2, 3], [0, 2], [0, 1, 2, 3], [1, 2], [1, 3], [0, 1], [3, 0], []];
const ex = [0, 0, 0, 0], ey = [0, 0, 0, 0];
let dots = 0;
function contour(iso) {
  for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++) {
    const q = j * NX + i, a = F[q], b = F[q + 1], cc = F[q + NX + 1], d = F[q + NX];
    const code = (a > iso) | (b > iso) << 1 | (cc > iso) << 2 | (d > iso) << 3;
    const t = TBL[code]; if (!t.length) continue;
    ex[0] = i + (iso - a) / (b - a); ey[0] = j; ex[1] = i + 1; ey[1] = j + (iso - b) / (cc - b);
    ex[2] = i + (iso - d) / (cc - d); ey[2] = j + 1; ex[3] = i; ey[3] = j + (iso - a) / (d - a);
    for (let k = 0; k < t.length; k += 2) {
      const x0 = ex[t[k]] * CELL, y0 = ey[t[k]] * CELL, x1 = ex[t[k + 1]] * CELL, y1 = ey[t[k + 1]] * CELL;
      const n = Math.max(1, Math.round(Math.hypot(x1 - x0, y1 - y0) / 3));
      for (let m = 0; m < n; m++) { const p = (m + 0.5) / n, x = x0 + (x1 - x0) * p, y = y0 + (y1 - y0) * p;
        const wx = Math.sin(T * 1.7 + x * 0.21 + y * 0.13) * 0.8, wy = Math.cos(T * 1.3 + x * 0.11 - y * 0.23) * 0.8;
        const s = 1.2 + 0.5 * Math.abs(Math.sin(x * 0.7 + y * 0.3));
        g.fillRect(x + wx, y + wy, s, s); dots++; }
    }
  }
}
// hatching: parallel dotted dashes that only exist where the field is above iso
function hatch(iso, ang, gap, dash, alpha) {
  const ux = Math.cos(ang), uy = Math.sin(ang), nx = -uy, ny = ux;
  const s0 = Math.min(0, W * nx, H * ny, W * nx + H * ny), s1 = Math.max(0, W * nx, H * ny, W * nx + H * ny);
  const t0 = Math.min(0, W * ux, H * uy, W * ux + H * uy), t1 = Math.max(0, W * ux, H * uy, W * ux + H * uy);
  g.strokeStyle = `rgba(40,97,122,${alpha})`; g.lineWidth = 1.5; g.lineCap = 'round'; g.setLineDash([0.1, dash]);
  let k = 0;
  for (let s = s0; s < s1; s += gap, k++) {
    const so = s + Math.sin(T * 0.5 + k * 0.7) * 0.6;
    g.lineDashOffset = -(T * 2.6 + k * 1.37); g.beginPath();
    let inside = false, px = 0, py = 0, pv = 0;
    for (let t = t0; t <= t1; t += 3) {
      const x = ux * t + nx * so, y = uy * t + ny * so;
      const on = x >= 0 && x < W && y >= 0 && y < H, v = on ? sample(x, y) : 0;
      const w = Math.sin(t * 0.05 + T * 0.7 + k) * 0.9;
      if (v > iso !== inside) {                        // crossing: land exactly on the boundary
        const f = (iso - pv) / (v - pv), cx = px + (x - px) * f, cy = py + (y - py) * f;
        if (inside) { g.lineTo(cx + nx * w, cy + ny * w); dots += 3; } else g.moveTo(cx + nx * w, cy + ny * w);
        inside = !inside;
      } else if (inside) { g.lineTo(x + nx * w, y + ny * w); dots++; }
      px = x; py = y; pv = v;
    }
    g.stroke();
  }
  g.setLineDash([]);
}

// the accent: a few warm specks where a boundary just split or merged
const sparks = []; for (let i = 0; i < 10; i++) sparks.push({ x: 0, y: 0, dx: 0, dy: 0, t: 9 });
const pp = [0, 0];
function spark() {
  pinch(pp);
  for (let i = 0; i < 8; i++) { const s = sparks[i], a = rnd() * 6.28, r = 2 + rnd() * 7;
    s.x = pp[0] + Math.cos(a) * r; s.y = pp[1] + Math.sin(a) * r; s.dx = Math.cos(a) * 4; s.dy = Math.sin(a) * 4; s.t = 0; }
}

let T = 0, nextKick = 2.5, nBlobs = -1, last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; T += dt; kT += dt;
  if (T > nextKick) { kick(); nextKick = T + 6.5 + rnd() * 1.5; }
  step(dt / 2); step(dt / 2);
  field();
  const nb = blobs(); if (nBlobs >= 0 && nb !== nBlobs) spark(); nBlobs = nb;

  g.clearRect(0, 0, W, H); dots = 0;
  hatch(ISO, 0.663, 4.2, 2.1, 0.5);            // 38 degrees, the body of the wash
  hatch(ISO * 1.7, 1.75, 6, 2.6, 0.4);         // cross-hatch only where the ink pools deepest
  g.fillStyle = PALE; contour(ISO_OUT);
  g.fillStyle = INK; contour(ISO);
  for (const s of sparks) { if (s.t > 1) continue; s.t += dt;
    g.fillStyle = `rgba(172,139,80,${1 - s.t})`; g.fillRect(s.x + s.dx * s.t, s.y + s.dy * s.t, 1.8, 1.8); dots++; }
  window.__dots = dots; window.__blobs = nb; window.__T = T;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
