<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f7f4ec; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; display: block; }
  .cap { display: none; }
</style>
</head>
<body>
<div>
<canvas id="c"></canvas>
<div class="cap">Make one sentence heavier and the whole structure hangs differently. The intro lightens, the thesis leans, and a new branch grows where the weight went.</div>
</div>
<script>
const W = 640, H = 400, DPR = Math.min(2, devicePixelRatio || 1);
const c = document.getElementById('c'); c.width = W * DPR; c.height = H * DPR;
const g = c.getContext('2d'); g.scale(DPR, DPR);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = [40,97,122], DEEP = [35,72,95], PALE = [155,173,176], TEAL = [107,140,136], VIOLET = [35,72,95], GOLD = [172,139,80], WARM = 'rgba(172,139,80,';
const SPEED = 1.7;
const mix = (a, b, t, al) => `rgba(${a[0] + (b[0] - a[0]) * t | 0},${a[1] + (b[1] - a[1]) * t | 0},${a[2] + (b[2] - a[2]) * t | 0},${al})`;
const mkAnts = (n, v0) => Array.from({ length: n }, () => ({ t: rnd(), v: v0 * (0.7 + rnd() * 0.6), j: rnd() * 6.28, r: 1.25 + rnd() * 0.6 }));

// ---- the structure: a thesis, paragraphs hung from it, sentences hung from those ----
// [id, parent, x, y, half-width, half-height, weight, when written]
const DEF = [
  ['T', null, 320, 68, 50, 12, 1.6, 0.3],
  ['A', 'T', 160, 168, 30, 9, 1, 1.3], ['B', 'T', 320, 168, 40, 12, 1, 2.1], ['C', 'T', 480, 168, 30, 9, 1, 2.9],
  ['a1', 'A', 122, 263, 17, 6, 0.8, 3.6], ['a2', 'A', 198, 263, 17, 6, 0.8, 3.9],
  ['b1', 'B', 282, 263, 17, 6, 0.8, 4.2], ['b2', 'B', 358, 263, 17, 6, 0.8, 4.5],
  ['c1', 'C', 442, 263, 17, 6, 0.8, 4.8], ['c2', 'C', 518, 263, 28, 9, 0.8, 5.1],
  ['c3', 'C', 578, 270, 17, 6, 1.0, 11.0],       // the new path, condensing out of scattered dots
  ['D', 'T', 590, 168, 30, 9, 0.15, 11.6],       // a fourth paragraph, a ghost until it firms
];
const LABELS = { T: 'Thesis', B: 'Paragraph', c2: 'Sentence' };
const SIBS = [['A', 'B'], ['B', 'C']];
const CROSS = [['c2', 'A'], ['a2', 'C']];
const K = 2, G = 16, ANCH = 8, HOMEX = 2.5, XF = 0.25, LEAN = 40, ACCEPT = 0.05;
let B, S, T, told, by;
const perim = (w, h, r) => 4 * (w + h) - 1.717 * r;
function reset() {
  seed = 7; T = 0; told = new Set(); S = []; by = {};
  B = DEF.map(d => ({ id: d[0], par: d[1], hx: d[2], hy: d[3], w: d[4], h: d[5], wt: d[6], tgt: d[6], at: d[7], x: d[2], y: d[3] - 10,
    alive: 0, born: false, ang: 0, com: 0, car: 0, hot: 0, cond: d[7] > 10 && d[1] !== 'T' ? 1 : 0, ghost: d[6] < 0.3, sp: rnd() * 9,
    ants: mkAnts(perim(d[4] * 1.55, d[5] * 1.55, d[5]) / 1.2 | 0, 0.012) }));
  B.forEach(b => { by[b.id] = b; b.sub = b.at > 10 ? 0 : b.wt; });
  for (let i = B.length - 1; i > 0; i--) if (B[i].at <= 10) by[B[i].par].sub += B[i].sub;
}
function spring(a, b, sib) {
  const dx = b.hx - a.hx, dy = b.hy - a.hy, L = Math.hypot(dx, dy);
  const L0 = sib ? L : L - b.sub * G / (K * (dy / L));    // hung so that, fully loaded, it rests where it was written
  S.push({ a, b, sib, k: sib ? 0.6 : K, L0, pull: 1, tau: 0, c0: b.sub || 1, born: T, ants: mkAnts(L * 0.8 | 0, 0.01) });
}
reset();

// ---- physics: first order (nothing bounces), gravity by weight, sibling rest lengths slowly accept what is ----
function step(dt) {
  for (const b of B) {
    b.wt += (b.tgt - b.wt) * 1.6 * dt; b.car = b.wt * b.alive;
    b.fx = (b.hx + b.com * LEAN - b.x) * HOMEX * (b.par ? 1 : 0.5);
    b.fy = b.par ? b.wt * G : (b.hy - 15 - b.y) * ANCH;
  }
  for (let i = B.length - 1; i > 0; i--) if (B[i].par) by[B[i].par].car += B[i].car;   // load carried, bottom up
  for (const b of B) {                                                                  // lean and tilt toward the weight beneath
    let m = 0, w = 0, sp = 1;
    for (const ch of B) if (ch.par === b.id && ch.alive > 0) { m += (ch.x - b.x) * ch.car; w += ch.car; sp = Math.max(sp, Math.abs(ch.hx - b.hx)); }
    if (w > 0) { const r = m / w / sp; b.com += (r - b.com) * 1.2 * dt; b.ang = b.com * 0.22; }
  }
  for (const s of S) {
    const a = s.a, b = s.b, dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1, Lt = s.L0 * s.pull;
    const f = s.k * Math.min(a.alive, b.alive) * (L - Lt) / L;
    a.fx += f * dx * XF; a.fy += f * dy; b.fx -= f * dx * XF; b.fy -= f * dy;
    if (s.sib) s.L0 += (L - s.L0) * ACCEPT * dt;
    const tau = s.sib ? (L - Lt) / Lt * 4 : (b.car / s.c0 - 1) * 0.8;                 // tension: load on a hanger, stretch on a sibling
    s.tau += (Math.max(-1, Math.min(1, tau)) - s.tau) * 2 * dt;
  }
  for (const b of B) if (b.alive > 0) { b.x += b.fx * dt; b.y += b.fy * dt; b.hot = Math.max(0, b.hot - dt / 2.5); b.cond = Math.max(0, b.cond - dt / 1.6); }
}

// ---- the story, on a clock ----
const ev = (t, key, fn) => { if (T >= t && !told.has(key)) { told.add(key); fn(); } };
function story(dt) {
  for (const b of B) if (T >= b.at) { if (!b.born) { b.born = true; if (b.par) spring(by[b.par], b, false); } b.alive = Math.max(0, Math.min(1, b.alive + dt * (b.gone ? -0.5 : 1.1))); }
  for (const [p, q] of SIBS) ev(Math.max(by[p].at, by[q].at) + 0.1, 's' + p + q, () => spring(by[p], by[q], true));
  for (const [p, q] of CROSS) ev(5.5, 'cross' + p + q, () => { spring(by[p], by[q], true); S[S.length - 1].cross = true; });
  ev(6.5, 'heavy', () => { by.c2.tgt = 2.6; by.c2.hot = 1; });                       // one sentence turns out to carry the essay
  ev(7.4, 'para', () => { by.C.tgt = 1.6; by.C.hot = 1; });
  ev(8.2, 'thesis', () => { by.T.hot = 1; });
  ev(8.8, 'intro', () => { for (const id of ['A', 'a1', 'a2']) by[id].tgt = 0.35; S.find(s => s.sib && s.b === by.B).pull = 1.3; });
  ev(14.5, 'fade', () => { by.D.gone = true; });                                      // the sketched fourth paragraph is not taken, this time
  if (T > 18) reset();
}

// ---- drawing: walking dots only ----
const P = [0, 0];
function rr(t, w, h, r) {                              // point on a rounded rectangle, by arc length
  const sw = 2 * (w - r), sh = 2 * (h - r), q = 1.5708 * r; let s = t * (2 * sw + 2 * sh + 4 * q);
  if ((s -= sw) < 0) { P[0] = -w + r + s + sw; P[1] = -h; return; }
  if ((s -= q) < 0) { const a = -1.5708 + (s + q) / r; P[0] = w - r + r * Math.cos(a); P[1] = -h + r + r * Math.sin(a); return; }
  if ((s -= sh) < 0) { P[0] = w; P[1] = -h + r + s + sh; return; }
  if ((s -= q) < 0) { const a = (s + q) / r; P[0] = w - r + r * Math.cos(a); P[1] = h - r + r * Math.sin(a); return; }
  if ((s -= sw) < 0) { P[0] = w - r - s - sw; P[1] = h; return; }
  if ((s -= q) < 0) { const a = 1.5708 + (s + q) / r; P[0] = -w + r + r * Math.cos(a); P[1] = h - r + r * Math.sin(a); return; }
  if ((s -= sh) < 0) { P[0] = -w; P[1] = h - r - s - sh; return; }
  const a = 3.1416 + Math.min(s, q) / r; P[0] = -w + r + r * Math.cos(a); P[1] = -h + r + r * Math.sin(a);
}
const edge = (b, ux, uy) => Math.min(b.h * b.sc / Math.max(0.2, Math.abs(uy)), b.w * b.sc / Math.max(0.2, Math.abs(ux))) + 2;
let last = performance.now(), dots = 0;
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000) * SPEED; last = now; T += dt;
  story(dt); step(dt / 2); step(dt / 2);
  const out = T > 17 ? Math.max(0, 18 - T) : 1;
  g.clearRect(0, 0, W, H); dots = 0;
  for (const b of B) b.sc = Math.pow(b.wt, 0.45);

  let worst = null;
  for (const s of S) {
    const a = s.a, b = s.b, live = Math.min(a.alive, b.alive); if (live <= 0) continue;
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, tau = s.tau;
    const p0 = edge(a, ux, uy), inner = Math.max(6, L - p0 - edge(b, ux, uy)), grow = Math.min(1, (T - s.born) / 1.2);
    const faint = b.ghost ? 0.4 : 1, spacing = 2.1 / (1 + tau * 0.6), amp = 3.2 * (1 - tau * 0.45), turns = Math.max(3, s.L0 / 14 | 0);
    const n = Math.min(s.ants.length, inner / spacing * grow | 0);
    g.fillStyle = tau > 0 ? mix(INK, VIOLET, tau, (0.68 + 0.3 * tau) * live * faint * out) : mix(INK, TEAL, -tau, (0.68 + 0.4 * tau) * live * faint * out);
    if (s.cross) g.fillStyle = WARM + (.65 * live * out) + ')';
    for (let k = 0; k < n; k++) {
      const an = s.ants[k]; an.t = (an.t + an.v * dt) % 1;
      const sPos = p0 + an.t * inner, z = Math.sin(an.t * 6.283 * turns) * amp + (s.cross ? Math.sin(an.t * Math.PI) * 20 : 0), r = an.r * (1 + tau * 0.35);
      g.fillRect(a.x + ux * sPos - uy * z + Math.cos(an.j + T * 2.2) * 0.5 - r / 2, a.y + uy * sPos + ux * z + Math.sin(an.j * 1.3 + T * 1.9) * 0.5 - r / 2, r, r); dots++;
    }
    if (tau > 0.5 && (!worst || tau > worst.tau)) worst = s;
  }
  if (worst) {                                          // a few warm specks on the single most strained spring
    const a = worst.a, b = worst.b, dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    g.fillStyle = WARM + Math.min(1, (worst.tau - 0.5) * 2.5) * out + ')';
    for (let q = 0; q < 4; q++) { const f = 0.25 + 0.5 * ((q * 0.37 + T * 0.12) % 1); g.fillRect(a.x + dx * f - 1, a.y + dy * f - 1, 2, 2); }
  }

  for (const b of B) {
    if (b.alive <= 0) continue;
    const w = b.w * b.sc, h = b.h * b.sc, r = Math.min(w, h) * 0.5, per = perim(w, h, r);
    const n = Math.min(b.ants.length, per / (2.1 / Math.sqrt(b.wt)) * b.alive / (b.ghost ? 2 : 1) | 0), jit = 0.5 + b.hot * 1.4;
    const al = (b.ghost ? 0.5 : 0.9) * out;
    const base = b.wt >= 1 ? mix(INK, VIOLET, Math.min(1, (b.wt - 1) / 1.2), al) : mix(INK, TEAL, Math.min(1, (1 - b.wt) / 0.6), al);
    g.fillStyle = b.hot > 0 ? mix(b.wt >= 1 ? VIOLET : TEAL, GOLD, b.hot, al) : base;
    g.save(); g.translate(b.x, b.y); g.rotate(b.ang);
    for (let k = 0; k < n; k++) {
      const an = b.ants[k]; an.t = (an.t + an.v * dt) % 1; rr(an.t, w, h, r);
      const sc = b.cond * b.cond * 45, sz = an.r * (0.85 + b.sc * 0.25);
      g.fillRect(P[0] + Math.cos(an.j + T * 2.4) * jit + Math.cos(an.j * 7) * sc - sz / 2, P[1] + Math.sin(an.j * 1.3 + T * 2.1) * jit + Math.sin(an.j * 11) * sc - sz / 2, sz, sz); dots++;
    }
    if (LABELS[b.id] && b.cond < .5) {
      g.fillStyle = mix(INK, DEEP, 0.5, b.alive * out);
      g.font = (b.id === 'T' ? '14px' : '12px') + ' Georgia, serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(LABELS[b.id], 0, 0);
    } else if (!b.ghost && b.cond < 0.5) {                     // the writing inside: a faint dot-dash row that slowly re-spaces
      g.fillStyle = mix(INK, INK, 0, (0.42 + b.hot * 0.3) * b.alive * out);
      const rows = h > 11 ? 2 : 1;
      for (let q = 0; q < rows; q++) { const y = rows === 1 ? 0 : (q - 0.5) * 7;
        for (let x = -w + 6; x < w - 6; x += 3) if (Math.sin(x * 0.35 + b.sp + q * 2 + T * (0.15 + b.hot * 3)) > -0.35) { g.fillRect(x, y - 0.6, 1.4, 1.2); dots++; } }
    }
    g.restore();
  }
  document.title = 'T ' + T.toFixed(1) + ' dots ' + dots;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
