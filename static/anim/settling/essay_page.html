<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f7f4ec; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; display: block; }
  .cap { display: none; }
</style>
</head>
<body>
<div>
<canvas id="c"></canvas>
<div class="cap">One sentence turns out to be the point. The intro loses its weight, a paragraph goes quiet, the thesis moves, and paths open below that were not there before.</div>
</div>
<script>
const W = 640, H = 400, DPR = 2;
const c = document.getElementById('c'); c.width = W * DPR; c.height = H * DPR;
const g = c.getContext('2d'); g.scale(DPR, DPR);
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = [40,97,122], DEEP = [35,72,95], PALE = [155,173,176], WARM = 'rgb(201,108,62)';
const mix = (a, b, t) => `rgb(${a[0] + (b[0] - a[0]) * t | 0},${a[1] + (b[1] - a[1]) * t | 0},${a[2] + (b[2] - a[2]) * t | 0})`;
const mkAnts = (n, v0) => Array.from({ length: n }, (_, k) => ({ t: k / n, v: v0 * (0.7 + rnd() * 0.6), j: rnd() * 6.28, r: 1.0 + rnd() * 0.6 }));

// ---- the page: one thesis, four paragraphs in reading order, a few sentences trailing each ----
const PL = 150, PR = 440, PX = (PL + PR) / 2, PHW = (PR - PL) / 2, PY = [125, 171, 217, 263], NS = [3, 2, 3, 2];
const DEF = [{ id: 'T', x: 255, y: 73, hw: 185, hh: 8, at: 0 }], LINKS = [];
NS.forEach((n, i) => {
  DEF.push({ id: 'P' + i, x: PX, y: PY[i], hw: PHW, hh: 6, at: 1 + i * 1.3 });
  LINKS.push(['T', 'P' + i, [-0.632 - i * 0.0865, 1], [-1, 0]]);          // down the left margin, one lane per paragraph
  if (i) LINKS.push(['P' + (i - 1), 'P' + i, [-0.8, 1], [-0.8, -1]]);
  for (let k = 0; k < n; k++) {
    DEF.push({ id: 'S' + i + k, x: PR + 38 + k * 36, y: PY[i], hw: 10, hh: 4, at: 1.5 + i * 1.3 + k * 0.4 });
    LINKS.push([k ? 'S' + i + (k - 1) : 'P' + i, 'S' + i + k, [1, 0], [-1, 0]]);
  }
});
[-90, 0, 90].forEach((dx, k) => DEF.push({ id: 'G' + k, x: PX + dx, y: 317, hw: 42, hh: 6, at: 99, ghost: true }));
const COL = ['T', 'P0', 'P1', 'P2', 'P3', 'G1'];

let B, S, T, told;
const byId = id => B.find(b => b.id === id);
const A = [0, 0], anchor = (b, an) => { A[0] = b.x + an[0] * b.hw; A[1] = b.y + an[1] * b.hh; };
function link(aId, bId, aa, ab, faint) {
  const a = byId(aId), b = byId(bId);
  anchor(a, aa); const x0 = A[0], y0 = A[1]; anchor(b, ab);
  const L = Math.hypot(A[0] - x0, A[1] - y0);
  S.push({ a, b, aa, ab, L0: L, L, hot: 0, born: T, faint: !!faint, ants: mkAnts((L * 0.6) | 0, 0.011) });
}
function reset() {
  seed = 7; T = 0; told = new Set(); S = [];
  B = DEF.map(d => ({ ...d, x0: d.x, y0: d.y, hwT: d.hw, hh0: d.hh, w: d.ghost ? 0.45 : 1, wt: d.ghost ? 0.45 : 1,
    alive: 0, hot: 0, gone: 0, label: '', seedp: rnd() * 9, ants: mkAnts(Math.max(40, 2 * (d.hw + d.hh)), 0.9 / (d.hw + d.hh)) }));
}
reset();

// ---- physics: overdamped (nothing bounces), plastic (rest lengths and home positions both remember) ----
const K = 0.8, ACCEPT = 0.12, HOME = 0.2;
function step(dt) {
  for (const b of B) {
    b.w += (b.wt - b.w) * 2 * dt; b.hh = b.hh0 * Math.pow(b.w, 0.6);
    b.hw += (b.hwT * (b.id[0] === 'S' ? Math.pow(b.w, 0.35) : 1) - b.hw) * 1.8 * dt;
    b.fx = (b.x0 - b.x) * HOME; b.fy = (b.y0 - b.y) * HOME;
    b.x0 += (b.x - b.x0) * ACCEPT * dt; b.y0 += (b.y - b.y0) * ACCEPT * dt;
  }
  for (const s of S) {
    const a = s.a, b = s.b; anchor(a, s.aa); const ax = A[0], ay = A[1]; anchor(b, s.ab);
    const dx = A[0] - ax, dy = A[1] - ay, L = Math.hypot(dx, dy) || 1;
    const f = K * Math.min(a.alive, b.alive) * (s.faint ? 0.35 : 1) * (L - s.L0) / L;
    a.fx += f * dx; a.fy += f * dy; b.fx -= f * dx; b.fy -= f * dy;
    s.L0 += (L - s.L0) * ACCEPT * dt; s.L = L;
  }
  for (let i = 1; i < COL.length; i++) {                 // stacked blocks keep a little air between them
    const a = byId(COL[i - 1]), b = byId(COL[i]); if (a.alive <= 0 || b.alive <= 0) continue;
    const gap = (b.y - b.hh) - (a.y + a.hh); if (gap < 14) { const f = (14 - gap) * 1.2; a.fy -= f; b.fy += f; }
  }
  for (const b of B) if (b.alive > 0) { b.x += b.fx * dt; b.y += b.fy * dt; }
}

// ---- the story, on a clock. A tug shortens (or slackens) a rest length once; the page keeps the result ----
const ev = (t, key, fn) => { if (T >= t && !told.has(key)) { told.add(key); fn(); } };
const tug = (aId, bId, pull) => { const s = S.find(s => s.a.id === aId && s.b.id === bId); if (s) { s.L0 *= pull; s.hot = 1; } };
const weigh = (id, w) => { const b = byId(id); b.wt = w; };
function story(dt) {
  for (const b of B) b.alive = b.gone ? Math.max(0, b.alive - dt / 1.2) : T >= b.at ? Math.min(1, b.alive + dt / 0.9) : 0;
  for (const l of LINKS) ev(Math.max(byId(l[0]).at, byId(l[1]).at) + 0.2, l[0] + l[1], () => link(...l));
  ev(7.0, 'a', () => { const s = byId('S21'); s.wt = 1.9; s.hot = 1; s.label = 'the sentence'; });
  ev(7.3, 'b', () => { tug('S20', 'S21', 0.7); byId('S20').hot = 0.5; });
  ev(7.6, 'c', () => { tug('P2', 'S20', 0.7); weigh('P2', 1.45); byId('P2').hot = 1; });
  ev(7.9, 'd', () => { tug('T', 'P2', 0.55); weigh('T', 1.2); byId('T').hot = 1; });
  ev(8.2, 'e', () => { tug('T', 'P0', 1.06); weigh('P0', 0.55); for (let k = 0; k < 3; k++) weigh('S0' + k, 0.7); });
  ev(8.5, 'f', () => { tug('T', 'P1', 1.08); weigh('P1', 0.32); for (let k = 0; k < 2; k++) weigh('S1' + k, 0.4); });
  ev(12.0, 'g', () => [-0.62, 0, 0.62].forEach((f, k) => { byId('G' + k).at = T; link('P3', 'G' + k, [f, 1], [0, -1], true); }));
  ev(14.0, 'h', () => { const p = byId('G1'); p.ghost = false; p.wt = 1.05; p.hot = 1; p.hwT = PHW;
    for (const s of S) if (s.b === p) s.faint = false; byId('G0').gone = byId('G2').gone = 1; });
  ev(15.3, 'i', () => link('T', 'G1', [-0.978, 1], [-1, 0]));
  if (T > 21) reset();
}

// ---- drawing: walking dots only. Taut springs dark and straight, slack ones pale and loose ----
const P = [0, 0];
function rectPoint(b, t) {                               // by arc length, so dots stay evenly spaced on long and short sides
  const w = b.hw, h = b.hh, d = t * 4 * (w + h);
  if (d < 2 * w) { P[0] = b.x - w + d; P[1] = b.y - h; }
  else if (d < 2 * w + 2 * h) { P[0] = b.x + w; P[1] = b.y - h + d - 2 * w; }
  else if (d < 4 * w + 2 * h) { P[0] = b.x + w - (d - 2 * w - 2 * h); P[1] = b.y + h; }
  else { P[0] = b.x - w; P[1] = b.y + h - (d - 4 * w - 2 * h); }
}
const colorOf = b => b.hot > 0 ? mix(INK, DEEP, Math.min(1, b.hot * 1.5)) : mix(INK, PALE, Math.max(0, Math.min(1, (0.9 - b.w) / 0.5)));
let dots = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; T += dt;
  story(dt);
  for (let i = 0; i < 2; i++) step(dt / 2);
  const out = T > 20 ? Math.max(0, 1 - (T - 20)) : 1;
  g.clearRect(0, 0, W, H); dots = 0;

  for (const s of S) {
    const a = s.a, b = s.b, live = Math.min(a.alive, b.alive); if (live <= 0) continue;
    anchor(a, s.aa); const ax = A[0], ay = A[1]; anchor(b, s.ab);
    const dx = A[0] - ax, dy = A[1] - ay, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const taut = Math.max(0, Math.min(1, (L - s.L0) / s.L0 * 4)), slack = Math.max(0, Math.min(1, (s.L0 - L) / s.L0 * 4));
    s.hot = Math.max(0, s.hot - dt / 1.6);
    const grow = Math.min(1, (T - s.born) / 1.1), inner = Math.max(4, L - 6), turns = Math.max(3, (s.L0 / 14) | 0);
    let alpha = Math.max(0.25, Math.min(1, 0.55 + taut * 0.5 - slack * 0.35 + s.hot * 0.3)) * live * out;
    if (s.faint || a.ghost || b.ghost) alpha *= 0.45;
    g.globalAlpha = alpha; g.fillStyle = s.hot > 0.3 ? mix(INK, DEEP, s.hot) : mix(INK, PALE, slack * 0.8);
    for (const an of s.ants) {
      if (an.t > grow) continue;
      an.t = (an.t + an.v * dt) % 1;
      const sPos = 3 + an.t * inner, z = Math.sin(an.t * 6.283 * turns) * (3 - taut * 1.6 + slack * 3 + s.hot * 1.2);
      const jx = Math.cos(an.j + T * 2.2) * 0.5, jy = Math.sin(an.j * 1.3 + T * 1.9) * 0.5, r = an.r * (1 + taut * 0.4 + s.hot * 0.4);
      g.fillRect(ax + ux * sPos - uy * z + jx - r / 2, ay + uy * sPos + ux * z + jy - r / 2, r, r); dots++;
    }
    if (s.hot > 0.15) {                                   // the tug itself: three warm specks running along the spring
      g.fillStyle = WARM; g.globalAlpha = Math.min(1, s.hot * 1.5) * live * out;
      for (let q = 0; q < 3; q++) { const sPos = 3 + inner * ((q / 3 + T * 0.45) % 1); g.fillRect(ax + ux * sPos - 1, ay + uy * sPos - 1, 2, 2); dots++; }
    }
  }
  for (const b of B) {
    if (b.alive <= 0) continue;
    b.hot = Math.max(0, b.hot - dt / 3);
    const dens = Math.min(1, b.w + 0.15), col = colorOf(b);
    g.globalAlpha = out * b.alive * (b.ghost ? 0.55 : 0.92); g.fillStyle = col;
    for (const an of b.ants) {
      if (an.j > dens * 6.28) continue;                   // weight is density: light blocks are sketched with fewer dots
      an.t = (an.t + an.v * dt) % 1; rectPoint(b, an.t);
      const r = an.r * (0.85 + 0.2 * Math.min(1.9, b.w));
      g.fillRect(P[0] + Math.cos(an.j + T * 2.4) * 0.55 - r / 2, P[1] + Math.sin(an.j * 1.3 + T * 2.1) * 0.55 - r / 2, r, r); dots++;
    }
    if (b.id[0] !== 'S' && !b.ghost) {                    // the writing inside; words reflow while the block is hot
      const rows = b.hh > 8.5 ? 2 : 1, len = b.hw * 2 - 14;
      g.globalAlpha = out * b.alive * (0.2 + 0.12 * Math.min(1.5, b.w));
      for (let r = 0; r < rows; r++) {
        const y = rows === 1 ? b.y : b.y + (r - 0.5) * b.hh * 0.95, l = len * (r === rows - 1 ? 0.62 + 0.2 * Math.sin(b.seedp) : 1);
        for (let x = -len / 2; x < -len / 2 + l; x += 3.4) {
          if (Math.sin(x * 0.61 + b.seedp + r * 2.1 + b.hot * T * 2) > 0.45) continue;
          g.fillRect(b.x + x + Math.sin(T * 0.7 + x) * 0.3, y - 0.5, 1.4, 1.1); dots++;
        }
      }
    }
    if (b.label || b.id === 'T') {
      g.font = "500 9.5px ui-monospace, Menlo, monospace"; g.fillStyle = mix(PALE, PALE, 0); g.globalAlpha = out * b.alive;
      if (b.id === 'T') { g.textAlign = 'left'; g.fillText('thesis', b.x - b.hw, b.y - b.hh - 7); }
      else { g.textAlign = 'center'; g.fillText(b.label, b.x, b.y + b.hh + 13); }
    }
  }
  g.globalAlpha = 1; window.__dots = dots; window.__T = T;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
