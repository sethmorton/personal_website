<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f7f4ec; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; display: block; }
  .cap { display: none; }
</style>
</head>
<body>
<div>
<canvas id="c" role="img" aria-label="A logbook fills with equal blue entries. One yellow point appears at the right. Reinterpretation travels left: the same unmoved marks become a rising signal through changes in ink weight alone. No new measurements are added."></canvas>
<div class="cap">Nothing new was measured. The same page now says something else.</div>
</div>
<script>
const started = performance.now();
const W = 640, H = 400, D = 2, CYCLE = 13.6;
const PAPER = '#f7f4ec', INK = '#28617a', DEEP = '#23485f', PALE = '#9badb0', WARM = '#ac8b50';
const c = document.getElementById('c'); c.width = W * D; c.height = H * D;
const g = c.getContext('2d'); g.scale(D, D);
let seed = 731;
const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const mix = (a, b, u) => a + (b - a) * u;
function layer(w = W, h = H) {
  const canvas = document.createElement('canvas'); canvas.width = w * D; canvas.height = h * D;
  const ctx = canvas.getContext('2d'); ctx.scale(D, D); return { canvas, ctx };
}
function grain(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
const paper = layer(); paper.ctx.fillStyle = PAPER; paper.ctx.fillRect(0, 0, W, H);
paper.ctx.globalCompositeOperation = 'multiply'; paper.ctx.fillStyle = INK;
for (let i = 0; i < 11000; i++) {
  paper.ctx.globalAlpha = (8 + rnd() * 4) / 255;
  grain(paper.ctx, rnd() * W, rnd() * H, .12 + Math.abs(rnd() + rnd() - 1) * .5);
}
paper.ctx.strokeStyle = INK; paper.ctx.lineWidth = .22; paper.ctx.globalAlpha = .035;
for (let i = 0; i < 160; i++) {
  const x = rnd() * W, y = rnd() * H;
  paper.ctx.beginPath(); paper.ctx.moveTo(x, y); paper.ctx.lineTo(x + 2 + rnd() * 5, y + rnd() - .5); paper.ctx.stroke();
}
const entries = [];
const rowDrift = Array.from({ length: 14 }, () => (rnd() - .5) * 11);
for (let row = 0; row < 14; row++) for (let col = 0; col < 18; col++) {
  const x = 64 + col * 27 + rowDrift[row] + (rnd() - .5) * 7;
  const y = 76 + row * 18 + Math.sin(col * .48 + row * 1.3) * 3.8 + (rnd() - .5) * 5;
  const length = 9 + rnd() * 9, bend = (rnd() - .5) * 3;
  const mask = layer(27, 14); mask.ctx.fillStyle = '#000';
  for (let j = 0; j < 155; j++) {
    const u = rnd(), yy = 6 + bend * Math.sin(u * Math.PI) + (rnd() + rnd() - 1) * 2.3;
    mask.ctx.globalAlpha = .2 + rnd() * .46;
    grain(mask.ctx, 3 + u * length, yy, .3 + rnd() * .8);
  }
  mask.ctx.globalCompositeOperation = 'destination-out'; mask.ctx.globalAlpha = .3;
  for (let j = 0; j < 2; j++) grain(mask.ctx, 4 + rnd() * (length - 2), 6 + (rnd() - .5), .6 + rnd());
  mask.ctx.globalCompositeOperation = 'source-over';
  for (let j = 0; j < 22; j++) {
    const u = rnd(); mask.ctx.globalAlpha = .10 + rnd() * .18;
    grain(mask.ctx, length + 6 + u * 2.2, 6.9 - u * 3, .2 + rnd() * .3);
  }
  const wet = layer(27, 14); wet.ctx.filter = 'blur(.65px)'; wet.ctx.drawImage(mask.canvas, 0, 0, 27, 14);
  const signalY = 284 - 174 * ease(col / 17);
  const relevance = Math.exp(-(((y - signalY) / 21) ** 2));
  const pollen = Array.from({ length: 23 }, () => ({ x: 3 + rnd() * length, y: 9.5 + rnd() * 1.7, r: .22 + rnd() * .42 }));
  entries.push({ x, y, length, mask: mask.canvas, wet: wet.canvas, relevance, pollen, born: .25 + (row * 18 + col) / 252 * 3.65 });
}
const inkRGB = [111, 137, 169], deepRGB = [35,72,95], paleRGB = [237, 240, 243];
for (const e of entries) {
  const importance = ease((e.relevance - .12) / .6);
  e.plates = [0, 1].map(u => {
    const plate = layer(27, 14), color = inkRGB.map((v, k) => Math.round(mix(v, mix(paleRGB[k], deepRGB[k], importance), u)));
    plate.ctx.drawImage(e.mask, 0, 0, 27, 14);
    plate.ctx.globalCompositeOperation = 'source-in'; plate.ctx.fillStyle = `rgb(${color.join(',')})`; plate.ctx.fillRect(0, 0, 27, 14);
    const tickColor = color.map((v, k) => Math.round(mix(v, [232, 184, 74][k], .48 * importance * u)));
    plate.ctx.globalCompositeOperation = 'source-atop'; plate.ctx.fillStyle = `rgb(${tickColor.join(',')})`;
    plate.ctx.fillRect(e.length + 5.5, 0, 7, 14);
    return plate.canvas;
  });
  const wet = layer(27, 14); wet.ctx.drawImage(e.wet, 0, 0, 27, 14);
  wet.ctx.globalCompositeOperation = 'source-in'; wet.ctx.fillStyle = INK; wet.ctx.fillRect(0, 0, 27, 14); e.wet = wet.canvas;
  const underglow = layer(27, 14);
  const glow = underglow.ctx.createRadialGradient(3 + e.length / 2, 10, 0, 3 + e.length / 2, 10, 11);
  glow.addColorStop(0, WARM + '34'); glow.addColorStop(.5, WARM + '1b'); glow.addColorStop(1, WARM + '00');
  underglow.ctx.fillStyle = glow; underglow.ctx.fillRect(0, 7.8, 27, 6.2); e.underglow = underglow.canvas;
}
function reinterpretation(e, t) { return ease((t - 6.55 - (551 - e.x) / 164) / .7); }
function entry(e, t) {
  const reveal = ease((t - e.born) / .26);
  if (!reveal) return;
  const u = reinterpretation(e, t);
  g.save(); g.beginPath(); g.rect(e.x, e.y - 7, 27 * reveal, 14); g.clip();
  // Add premultiplied plates on transparency so their unchanged alpha sums exactly.
  g.globalCompositeOperation = 'lighter';
  g.globalAlpha = 1 - u; g.drawImage(e.plates[0], e.x, e.y - 7, 27, 14);
  g.globalAlpha = u; g.drawImage(e.plates[1], e.x, e.y - 7, 27, 14);
  g.globalCompositeOperation = 'source-over';
  const wetness = (1 - ease((t - e.born - .3) / .55)) * reveal;
  if (wetness) {
    g.globalAlpha = wetness * .48; g.drawImage(e.wet, e.x, e.y - 7, 27, 14);
  }
  g.restore();
}
const call = layer(112, 48);
const leak = call.ctx.createRadialGradient(68, 24, 1, 68, 24, 45);
leak.addColorStop(0, WARM + '20'); leak.addColorStop(.55, WARM + '0c'); leak.addColorStop(1, WARM + '00');
call.ctx.fillStyle = leak; call.ctx.save(); call.ctx.translate(0, 14); call.ctx.scale(1, .42);
call.ctx.fillRect(0, 0, 112, 65); call.ctx.restore();
const halo = call.ctx.createRadialGradient(89, 24, 1, 89, 24, 15);
halo.addColorStop(0, WARM + '60'); halo.addColorStop(.4, WARM + '2c'); halo.addColorStop(1, WARM + '00');
call.ctx.fillStyle = halo; grain(call.ctx, 89, 24, 15);
call.ctx.fillStyle = WARM;
for (let j = 0; j < 480; j++) {
  const angle = rnd() * Math.PI * 2, radius = Math.sqrt(rnd()) * (4.2 + Math.sin(angle * 3) * .65 + Math.sin(angle * 7) * .35);
  call.ctx.globalAlpha = .18 + rnd() * .52;
  grain(call.ctx, 89 + Math.cos(angle) * radius, 24 + Math.sin(angle) * radius, .22 + rnd() * .8);
}
call.ctx.globalCompositeOperation = 'destination-out'; call.ctx.globalAlpha = .46;
grain(call.ctx, 88.1, 22.5, 1.5); grain(call.ctx, 91.4, 24.8, .8);
call.ctx.globalCompositeOperation = 'source-over'; call.ctx.fillStyle = WARM;
for (let j = 0; j < 170; j++) {
  const angle = rnd() * Math.PI * 2, radius = 4 + rnd() * 9;
  call.ctx.globalAlpha = .09 + rnd() * .23;
  grain(call.ctx, 89 + Math.cos(angle) * radius, 24 + Math.sin(angle) * radius, .16 + rnd() * .4);
}
function draw(t) {
  t = ((t % CYCLE) + CYCLE) % CYCLE; window.__t = t;
  g.globalAlpha = 1; g.clearRect(0, 0, W, H);
  for (const e of entries) entry(e, t);
  g.globalCompositeOperation = 'destination-over'; g.drawImage(paper.canvas, 0, 0, W, H);
  g.globalCompositeOperation = 'source-over';
  // This second plate changes the reading, never the recorded blue geometry.
  g.fillStyle = WARM;
  for (const e of entries) {
    const warmth = reinterpretation(e, t) * ease((e.relevance - .2) / .55);
    if (!warmth) continue;
    g.globalAlpha = warmth; g.drawImage(e.underglow, e.x, e.y - 7, 27, 14);
    for (let i = 0; i < e.pollen.length; i++) {
      const p = e.pollen[i]; g.globalAlpha = .92 * ease(warmth * 1.4 - i / e.pollen.length * .35);
      grain(g, e.x + p.x, e.y - 7 + p.y, p.r);
    }
  }
  g.globalAlpha = ease((t - 6.05) / .35); g.drawImage(call.canvas, 494, 90, 112, 48);
  g.globalAlpha = ease((t - 12.8) / .8); g.drawImage(paper.canvas, 0, 0, W, H); g.globalAlpha = 1;
}
const frozen = new URLSearchParams(location.search).get('t');
if (frozen !== null) draw(Number(frozen) || 0);
else {
  const epoch = performance.now();
  const tick = now => { draw((now - epoch) / 1000); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
window.__renderMs = performance.now() - started;
</script>
</body>
</html>
