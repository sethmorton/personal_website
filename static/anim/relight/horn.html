const ph = new Float32Array(MAX), wv = new Float32Array(MAX), wr = new Float32Array(MAX), sz = new Float32Array(MAX);

function scramble(n, m) {                              // a hiss position within 55 px of home, kept on the stage

for (let q = 0; q < 6; q++) for (let k = 0; k < 6; k++) {
  const [col, al] = SETTLED[q >> 1], t = k / 5;
  STYLE.push(mix(q & 1 ? INK : PALE, col, t, 0.45 + (al - 0.45) * t));
}
STYLE.push(mix(DEEP, DEEP, 0, 0.72));

let dots = 0;
function tick(dt) {
  T += dt;
  if (T - c0 >= CYC) startCycle();
  const t = T - c0;
  if (phase === 0 && t >= T_TOUCH) call();
  if (phase === 1 && t >= T_LOOSE) loosen();
  const de = ease((t - T_LOOSE) / LOOSE);
  ofx = ofx0 + (ofx1 - ofx0) * de; ofy = ofy0 + (ofy1 - ofy0) * de;

  for (let n = 0; n < N; n++) {
    const u = (T - ta[n]) / du[n], p = p0[n] + (p1[n] - p0[n]) * ease(u);
    P[n] = p;
    const img = n < NIMG, a = ph[n] + T * wv[n], r = wr[n] * (1 + 2.2 * (1 - p));
    X[n] = hx[n] + (img ? ofx : 0) + dx[n] * (1 - p) + Math.cos(a) * r;
    Y[n] = hy[n] + (img ? ofy : 0) + dy[n] * (1 - p) + Math.sin(a * 1.3 + ph[n]) * r * 0.8;
    const moving = u > 0.33 && u < 0.75 && p1[n] > p0[n];
    bkt[n] = moving ? 36 : (img ? tone[n] : 4 + tone[n]) * 6 + Math.round(p * 5);
  }
  g.clearRect(0, 0, W, H); dots = 0;
  for (let b = 0; b < 37; b++) {
    g.fillStyle = STYLE[b];
    for (let n = 0; n < N; n++) if (bkt[n] === b) {
      const s = sz[n] + 0.12 * Math.sin(T * 0.7 + ph[n]) + (b === 36 ? 0.3 : 0);
      g.fillRect(X[n] - s / 2, Y[n] - s / 2, s, s); dots++;
    }
  }

  // the call: a DEEP dotted thread enters from the right, touches, then draws itself in to the touch point
  if (t > T_CALL && t < T_TOUCH + 2.2) {
    const head = ease((t - T_CALL) / (T_TOUCH - T_CALL)), tail = ease((t - T_TOUCH - 0.4) / 1.6);
    const L = Math.hypot(tcx - lx0, tcy - ly0), nd = Math.round(L / 3.2);
    g.fillStyle = 'rgba(35,72,95,0.92)';
    for (let k = 0; k < nd; k++) {
      const s = (k + 0.5) / nd; if (s < tail || s > head) continue;
      const x = lx0 + (tcx - lx0) * s + Math.sin(T * 1.5 + k * 0.9) * 0.6, y = ly0 + (tcy - ly0) * s + Math.cos(T * 1.2 + k * 1.3) * 0.6;
      g.fillRect(x - 1.05, y - 1.05, 2.1, 2.1); dots++;
    }
  }
  // the touch: four warm specks where the thread landed, gone within two seconds
  const age = t - T_TOUCH;
  if (age > 0 && age < 2) {
    g.fillStyle = WARM;
    for (let q = 0; q < 4; q++) {
      const a = q * 1.57 + T * 0.8, rr = 2 + age * 3, k = age < 1.5 ? 1 : 1 - (age - 1.5) * 2;
      g.fillRect(tcx + Math.cos(a) * rr - k, tcy + Math.sin(a) * rr - k, 2 * k, 2 * k); dots++;
    }
  }
  window.__dots = dots; window.__T = T; window.__N = N;
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now;
  tick(dt);
  requestAnimationFrame(frame);
}
window.tick = tick;
build();
requestAnimationFrame(frame);
</script>
