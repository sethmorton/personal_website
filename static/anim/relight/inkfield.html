<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f7f4ec; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; }
  .cap { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap">A new fact lands and the whole sheet folds around it. Nothing goes back.</div>
<script>
const W = 640, H = 400, DPR = Math.min(2, devicePixelRatio || 1);
const c = document.getElementById('c'); c.width = W * DPR; c.height = H * DPR;
const g = c.getContext('2d'); g.scale(DPR, DPR);

// three density buckets: crowded lattice reads dark, stretched lattice reads faint
const INKS = ['rgba(40,97,122,0.32)', 'rgba(40,97,122,0.62)', 'rgba(58,92,132,0.9)'];
const DEEP = 'rgba(35,72,95,0.95)', PALE = 'rgba(155,173,176,0.9)', WARM = 'rgba(172,139,80,0.95)';

let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// jittered hex lattice, generous margins
const SP = 7.6, COLS = 73, ROWS = 48, N = COLS * ROWS;
const OX = (W - (COLS - 0.5) * SP) / 2, OY = (H - (ROWS - 1) * SP * 0.866) / 2;
const ox = new Float32Array(N), oy = new Float32Array(N);   // pristine lattice
const tx = new Float32Array(N), ty = new Float32Array(N);   // target home (accumulated warp)
const sx = new Float32Array(N), sy = new Float32Array(N);   // home at start of current transition
const hx = new Float32Array(N), hy = new Float32Array(N);   // current home
const px = new Float32Array(N), py = new Float32Array(N);   // drawn position this frame
const spd = new Float32Array(N);                            // current home velocity (px/s)
const dly = new Float32Array(N);                            // wave arrival delay for current transition
const ph = new Float32Array(N), wv = new Float32Array(N), wr = new Float32Array(N), sz = new Float32Array(N);
const lvl = new Uint8Array(N);                              // density bucket
for (let r = 0, i = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++, i++) {
  ox[i] = tx[i] = sx[i] = hx[i] = OX + cc * SP + (r & 1) * SP / 2 + (rnd() - 0.5) * 1.2;
  oy[i] = ty[i] = sy[i] = hy[i] = OY + r * SP * 0.866 + (rnd() - 0.5) * 1.2;
  ph[i] = rnd() * 6.283; wv[i] = 0.5 + rnd() * 0.9; wr[i] = 0.6 + rnd() * 0.8; sz[i] = 1.4 + rnd() * 0.3;
}

// the disturbance: a permanent displacement kernel (radial pull/push + swirl, gaussian core with a long tail
// so the far sheet shifts too) folded into every home
const SIGMA = 88, DUR = 2.2, WAVE = 150;
let T = 0, t0 = -10, nextHit = 2.2, hits = 0, relaxAt = 6 + (rnd() * 3 | 0);
const fact = { x: -100, y: -100, t: -10 };
function land() {
  const fx = 110 + rnd() * (W - 220), fy = 85 + rnd() * (H - 170);
  const A = rnd() < 0.3 ? 10 + rnd() * 8 : -(15 + rnd() * 12), S = (rnd() < 0.5 ? -1 : 1) * (22 + rnd() * 14);
  // occasional relaxation toward neutral, only enough to stay on canvas; folded into the same slow wave
  let relax = 0, over = 0;
  for (let i = 0; i < N; i++) over = Math.max(over, 26 - tx[i], tx[i] - W + 26, 26 - ty[i], ty[i] - H + 26);
  if (++hits >= relaxAt) { relax = 0.28; hits = 0; relaxAt = 6 + (rnd() * 3 | 0); }
  if (over > 0) relax = Math.max(relax, Math.min(0.7, 0.3 + over / 25));
  for (let i = 0; i < N; i++) {
    sx[i] = hx[i]; sy[i] = hy[i];
    let x = tx[i] + (ox[i] - tx[i]) * relax, y = ty[i] + (oy[i] - ty[i]) * relax;
    // gaussian vortex profile: displacement grows linearly from the impact (no overshoot), peaks at SIGMA, long tail beyond
    const dx = x - fx, dy = y - fy, d = Math.hypot(dx, dy) + 1e-3, q = d * d / (2 * SIGMA * SIGMA), w = (d / SIGMA) * (Math.exp(0.5 - q) + 0.15 / (1 + q));
    tx[i] = x + (A * dx - S * dy) / d * w; ty[i] = y + (A * dy + S * dx) / d * w;
    dly[i] = d / WAVE;
  }
  t0 = T; fact.x = fx; fact.y = fy; fact.t = T;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; T += dt;
  if (T > nextHit) { land(); nextHit = T + 6.5 + rnd() * 1.5; }

  // ease every home toward its target, delayed by distance so a wave travels outward
  for (let i = 0; i < N; i++) {
    let u = (T - t0 - dly[i]) / DUR; u = u < 0 ? 0 : u > 1 ? 1 : u;
    const e = u * u * (3 - 2 * u);
    const mx = tx[i] - sx[i], my = ty[i] - sy[i];
    hx[i] = sx[i] + mx * e; hy[i] = sy[i] + my * e;
    spd[i] = u > 0.3 && u < 0.5 ? mx * mx + my * my : 0;    // the travelling front: mid-transition and actually moving
    // each dot walks a tiny loop around its home so the sheet never sits still
    const a = ph[i] + T * wv[i];
    px[i] = hx[i] + Math.cos(a) * wr[i]; py[i] = hy[i] + Math.sin(a * 1.3 + ph[i]) * wr[i] * 0.8;
  }

  g.clearRect(0, 0, W, H);
  // every 9th row traced as a thread of finer pale dots so the folds read as fabric
  g.fillStyle = PALE;
  for (let r = 4; r < ROWS; r += 9) for (let i = r * COLS, end = i + COLS - 1; i < end; i++)
    g.fillRect((hx[i] + hx[i + 1]) / 2 - 0.55, (hy[i] + hy[i + 1]) / 2 - 0.55, 1.1, 1.1);
  // density shading: compare the gap to the row neighbour against the rest gap
  for (let r = 0, i = 0; r < ROWS; r++) for (let cc = 0; cc < COLS; cc++, i++) {
    const j = cc < COLS - 1 ? i + 1 : i - 1;
    const gap = Math.hypot(hx[j] - hx[i], hy[j] - hy[i]) / SP;
    lvl[i] = gap < 0.93 ? 2 : gap < 1.05 ? 1 : 0;
  }
  for (let L = 0; L < 3; L++) {
    g.fillStyle = INKS[L];
    for (let i = 0; i < N; i++) if (lvl[i] === L && spd[i] < 1.5) {
      const s = sz[i] + L * 0.35;
      g.fillRect(px[i] - s / 2, py[i] - s / 2, s, s);
    }
  }
  g.fillStyle = DEEP;
  for (let i = 0; i < N; i++) if (spd[i] >= 1.5) { const s = sz[i] + 0.5; g.fillRect(px[i] - s / 2, py[i] - s / 2, s, s); }
  // the fact itself: a few warm specks where it landed, settling into the sheet
  const age = T - fact.t;
  if (age < 6) {
    g.fillStyle = WARM;
    const k = Math.min(1, age * 2);
    for (let q = 0; q < 4; q++) {
      const a = q * 1.57 + T * 0.9, rr = 1.5 + k * 2.5;
      g.fillRect(fact.x + Math.cos(a) * rr - 1, fact.y + Math.sin(a) * rr - 1, 2, 2);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
