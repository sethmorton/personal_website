<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>The shape of inference — persistent state</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				color-scheme: light;
				--paper: #fafaf9;
				--indigo: #1f4f8f;
				--gold: #c2a877;
				--slate: #7188a4;
				--muted: #726b61;
				font:
					11px/1.5 'IBM Plex Mono',
					ui-monospace,
					monospace;
				color: var(--muted);
				background: var(--paper);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				overflow: hidden;
			}
			canvas {
				display: block;
				width: 100vw;
				height: 100vh;
				touch-action: pan-y;
				cursor: grab;
			}
			canvas:active {
				cursor: grabbing;
			}
			header,
			footer {
				position: absolute;
				left: 28px;
				right: 28px;
				pointer-events: none;
			}
			header {
				top: 24px;
				display: flex;
				justify-content: space-between;
				gap: 12px;
			}
			.title {
				color: var(--indigo);
				letter-spacing: 0.18em;
				text-transform: uppercase;
			}
			#status {
				color: var(--muted);
			}
			footer {
				bottom: 0;
				padding: 14px 0 20px;
				border-top: 1px solid #e6e2db;
				background: var(--paper);
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 16px;
			}
			.legend {
				display: flex;
				gap: 15px;
				color: var(--muted);
			}
			.legend span::before {
				content: '';
				display: inline-block;
				width: 16px;
				height: 1px;
				margin: 0 6px 3px 0;
				background: var(--color);
			}
			.hint {
				margin-top: 6px;
				color: var(--muted);
				font-size: 10px;
			}
			.controls {
				display: flex;
				gap: 7px;
				pointer-events: auto;
			}
			button {
				color: var(--muted);
				border: 1px solid #d8d4cc;
				border-radius: 999px;
				background: var(--paper);
				padding: 8px 14px;
				min-height: 36px;
				transition:
					color 150ms ease,
					border-color 150ms ease,
					background 150ms ease;
				font: inherit;
				cursor: pointer;
				white-space: nowrap;
			}
			#evidence {
				color: var(--indigo);
				border-color: #b7c4d4;
				background: #f0f3f7;
			}
			button:hover,
			#evidence:hover {
				border-color: var(--gold);
				background: #f3f1ec;
				color: var(--indigo);
			}
			button:focus-visible,
			canvas:focus-visible {
				outline: 2px solid var(--indigo);
				outline-offset: 3px;
			}
			canvas:focus-visible {
				outline-offset: -3px;
			}
			#fallback {
				position: absolute;
				top: 40%;
				left: 10%;
				right: 10%;
				text-align: center;
			}
			@media (max-width: 480px) {
				header,
				footer {
					left: 20px;
					right: 20px;
				}
				header {
					font-size: 10px;
				}
				footer {
					align-items: start;
					flex-direction: column;
					gap: 12px;
				}
				.legend {
					gap: 10px;
					font-size: 10px;
				}
			}
		</style>
	</head>
	<body>
		<header><span class="title">Persistent state</span><span id="status">Settled</span></header>
		<canvas
			aria-label="Three connected wireframe layers with rolling balls. New evidence sends broad waves across the field. Drag horizontally or use arrow keys to rotate."
			tabindex="0"
		></canvas>
		<p id="fallback" hidden>
			The interactive field needs WebGL. New evidence pushes on a local region; connected regions
			respond until the field settles into a new shape.
		</p>
		<footer>
			<div>
				<div class="legend">
					<span style="--color: var(--indigo)">State</span
					><span style="--color: var(--gold)">Displacement</span
					><span style="--color: var(--slate)">Tangent</span>
				</div>
				<div class="hint">Drag to orbit · a schematic of settling</div>
			</div>
			<div class="controls">
				<button id="evidence" type="button">Add evidence</button
				><button id="pause" type="button" aria-pressed="false">Pause</button>
			</div>
		</footer>
		<script type="module">
			import * as THREE from '../lib/three.module.js';

			const canvas = document.querySelector('canvas');
			const status = document.querySelector('#status');
			const pause = document.querySelector('#pause');
			const evidence = document.querySelector('#evidence');
			const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
			let renderer;
			try {
				renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
			} catch {
				document.querySelector('#fallback').hidden = false;
				pause.disabled = evidence.disabled = true;
			}
			if (renderer) init();

			function init() {
				renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
				const palette = getComputedStyle(document.documentElement);
				const color = (name) => palette.getPropertyValue(`--${name}`).trim();
				const scene = new THREE.Scene();
				scene.background = new THREE.Color(color('paper'));
				scene.fog = new THREE.Fog(color('paper'), 16, 30);
				const camera = new THREE.PerspectiveCamera(39, 1, 0.1, 100);
				const field = new THREE.Group();
				scene.add(field);
				const NX = 45,
					NZ = 31,
					COUNT = NX * NZ;
				const base = new Float32Array(COUNT);
				const displacement = new Float32Array(COUNT);
				const velocity = new Float32Array(COUNT);
				const target = new Float32Array(COUNT);
				const sweep = new Float32Array(COUNT);
				const waves = [];
				const x = (i) => ((i % NX) / (NX - 1) - 0.5) * 8.6;
				const z = (i) => (Math.floor(i / NX) / (NZ - 1) - 0.5) * 5.6;
				for (let i = 0; i < COUNT; i++) {
					base[i] =
						0.35 * Math.sin(x(i) * 0.85 + z(i) * 0.6) + 0.24 * Math.cos(z(i) * 1.25 - x(i) * 0.25);
				}
				const triangles = [];
				for (let row = 0; row < NZ - 1; row++) {
					for (let col = 0; col < NX - 1; col++) {
						const i = row * NX + col;
						triangles.push(i, i + NX, i + 1, i + 1, i + NX, i + NX + 1);
					}
				}
				const layers = [-1.25, 0, 1.25].map((height, layer) => {
					const geometry = new THREE.BufferGeometry();
					geometry.setAttribute(
						'position',
						new THREE.BufferAttribute(new Float32Array(COUNT * 3), 3).setUsage(
							THREE.DynamicDrawUsage
						)
					);
					geometry.setIndex(triangles);
					const mesh = new THREE.Mesh(
						geometry,
						new THREE.MeshBasicMaterial({
							color: color('indigo'),
							wireframe: true,
							transparent: true,
							opacity: layer === 1 ? 0.46 : 0.2,
							depthTest: false
						})
					);
					field.add(mesh);
					return { geometry, height, layer };
				});
				function lines(count, color, opacity = 1) {
					const geometry = new THREE.BufferGeometry();
					geometry.setAttribute(
						'position',
						new THREE.BufferAttribute(new Float32Array(count * 6), 3).setUsage(
							THREE.DynamicDrawUsage
						)
					);
					const line = new THREE.LineSegments(
						geometry,
						new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthTest: false })
					);
					line.frustumCulled = false;
					field.add(line);
					return geometry.attributes.position;
				}
				const samples = [];
				for (let row = 1; row < NZ - 1; row += 2) {
					for (let col = 1; col < NX - 1; col += 2) samples.push(row * NX + col);
				}
				const displacementVectors = lines(samples.length, color('gold'), 0.95);
				const tangentVectors = lines(samples.length, color('slate'), 0.65);
				const ties = lines(24, color('slate'), 0.16);
				const bounds = new THREE.Box3Helper(
					new THREE.Box3(new THREE.Vector3(-4.3, -3, -2.8), new THREE.Vector3(4.3, 3.2, 2.8)),
					color('gold')
				);
				bounds.material.transparent = true;
				bounds.material.opacity = 0.32;
				field.add(bounds);
				const grid = new THREE.GridHelper(13, 26, color('gold'), color('slate'));
				grid.position.y = -3.15;
				grid.material.transparent = true;
				grid.material.opacity = 0.13;
				scene.add(grid);
				scene.add(new THREE.HemisphereLight('#ffffff', color('slate'), 2));
				const light = new THREE.DirectionalLight('#ffffff', 3);
				light.position.set(-4, 8, 5);
				scene.add(light);
				const ballGeometry = new THREE.SphereGeometry(0.23, 24, 16);
				const balls = Array.from({ length: 9 }, (_, i) => {
					const tint = color(i % 3 === 0 ? 'gold' : i % 3 === 1 ? 'indigo' : 'slate');
					const mesh = new THREE.Mesh(
						ballGeometry,
						new THREE.MeshStandardMaterial({
							color: tint,
							metalness: 0.25,
							roughness: 0.25,
							transparent: true
						})
					);
					mesh.renderOrder = 5;
					field.add(mesh);
					const trail = new THREE.BufferGeometry();
					trail.setAttribute(
						'position',
						new THREE.BufferAttribute(new Float32Array(36 * 3), 3).setUsage(THREE.DynamicDrawUsage)
					);
					const line = new THREE.Line(
						trail,
						new THREE.LineBasicMaterial({ color: tint, transparent: true, opacity: 0.3 })
					);
					line.frustumCulled = false;
					field.add(line);
					return {
						mesh,
						trail,
						layer: Math.floor(i / 3),
						x: Math.sin(i * 2.4) * 3,
						z: Math.cos(i * 1.7) * 1.8,
						vx: Math.cos(i * 1.9) * 1.4,
						vz: Math.sin(i * 1.9) * 1.4,
						fresh: true
					};
				});

				let paused = reducedMotion.matches;
				let visible = true;
				let angle = 0.66,
					elevation = 0.56,
					time = 0,
					nextEvidence = 0.25,
					event = 0;
				let energy = 0;
				function addEvidence() {
					event++;
					const sx = Math.sin(event * 2.399) * 2.9;
					const sz = Math.cos(event * 1.73) * 1.8;
					if (!paused) {
						waves.push({ x: sx, z: sz, start: time });
						for (const ball of balls) {
							const dx = ball.x - sx,
								dz = ball.z - sz;
							const distance = Math.hypot(dx, dz) || 1;
							ball.vx += (dx / distance) * 1.3;
							ball.vz += (dz / distance) * 1.3;
						}
					}
					for (let i = 0; i < COUNT; i++) {
						const distance = (x(i) - sx) ** 2 + (z(i) - sz) ** 2;
						target[i] = Math.max(
							-0.85,
							Math.min(
								0.85,
								target[i] + (event % 3 === 0 ? -0.85 : 0.7) * Math.exp(-distance / 1.5)
							)
						);
					}
					nextEvidence = time + 2.2;
					// Explicit actions remain available with motion paused; show their settled result.
					if (paused) for (let i = 0; i < 500; i++) step(1 / 120);
					updateGeometry();
					render();
				}
				function step(dt) {
					energy = 0;
					// A damped spring sheet: restoring forces plus coupling to adjacent states.
					for (let i = 0; i < COUNT; i++) {
						let sum = 0,
							neighbors = 0;
						if (i % NX > 0) {
							sum += displacement[i - 1];
							neighbors++;
						}
						if (i % NX < NX - 1) {
							sum += displacement[i + 1];
							neighbors++;
						}
						if (i >= NX) {
							sum += displacement[i - NX];
							neighbors++;
						}
						if (i < COUNT - NX) {
							sum += displacement[i + NX];
							neighbors++;
						}
						const force =
							7 * (target[i] - displacement[i]) + 55 * (sum - neighbors * displacement[i]);
						velocity[i] += (force - 4.5 * velocity[i]) * dt;
						energy += velocity[i] ** 2;
					}
					for (let i = 0; i < COUNT; i++) displacement[i] += velocity[i] * dt;
				}
				function surfaceHeight(layer, px, pz) {
					const col = THREE.MathUtils.clamp((px / 8.6 + 0.5) * (NX - 1), 0, NX - 1.001);
					const row = THREE.MathUtils.clamp((pz / 5.6 + 0.5) * (NZ - 1), 0, NZ - 1.001);
					const i = Math.floor(row) * NX + Math.floor(col);
					const positions = layers[layer].geometry.attributes.position;
					return THREE.MathUtils.lerp(
						THREE.MathUtils.lerp(positions.getY(i), positions.getY(i + 1), col % 1),
						THREE.MathUtils.lerp(positions.getY(i + NX), positions.getY(i + NX + 1), col % 1),
						row % 1
					);
				}
				function updateBalls(dt) {
					for (const ball of balls) {
						const height = (x, z) => surfaceHeight(ball.layer, x, z);
						ball.vx -=
							((height(ball.x + 0.08, ball.z) - height(ball.x - 0.08, ball.z)) / 0.16) * 5 * dt;
						ball.vz -=
							((height(ball.x, ball.z + 0.08) - height(ball.x, ball.z - 0.08)) / 0.16) * 5 * dt;
						const damping = Math.exp(-0.35 * dt);
						ball.vx = THREE.MathUtils.clamp(ball.vx * damping, -3.5, 3.5);
						ball.vz = THREE.MathUtils.clamp(ball.vz * damping, -3.5, 3.5);
						ball.x += ball.vx * dt;
						ball.z += ball.vz * dt;
						if (Math.abs(ball.x) > 3.95) {
							ball.x = Math.sign(ball.x) * 3.95;
							ball.vx *= -0.85;
						}
						if (Math.abs(ball.z) > 2.45) {
							ball.z = Math.sign(ball.z) * 2.45;
							ball.vz *= -0.85;
						}
						ball.mesh.position.set(ball.x, height(ball.x, ball.z) + 0.23, ball.z);
						ball.mesh.rotation.z -= (ball.vx * dt) / 0.23;
						ball.mesh.rotation.x += (ball.vz * dt) / 0.23;
						const trail = ball.trail.attributes.position;
						if (ball.fresh) {
							for (let k = 0; k < trail.count; k++)
								trail.setXYZ(k, ball.x, ball.mesh.position.y, ball.z);
							ball.fresh = false;
						} else if (dt > 0) {
							trail.array.copyWithin(0, 3);
							trail.setXYZ(trail.count - 1, ball.x, ball.mesh.position.y, ball.z);
						}
						trail.needsUpdate = true;
					}
				}
				function updateGeometry(dt = 0) {
					while (waves.length && time - waves[0].start > 3.4) waves.shift();
					for (let i = 0; i < COUNT; i++) {
						sweep[i] = 0;
						for (const wave of waves) {
							const age = time - wave.start;
							const front = Math.hypot(x(i) - wave.x, z(i) - wave.z) - age * 4.8;
							sweep[i] +=
								1.15 * Math.cos(front * 1.6) * Math.exp(-front * front * 0.35 - age * 0.32);
						}
					}
					for (const { geometry, height, layer } of layers) {
						const positions = geometry.attributes.position;
						for (let i = 0; i < COUNT; i++) {
							positions.setXYZ(
								i,
								x(i),
								height +
									base[i] * (layer === 1 ? 1 : 0.7) +
									(displacement[i] + sweep[i]) * (layer === 1 ? 1 : 0.65),
								z(i)
							);
						}
						positions.needsUpdate = true;
						geometry.computeBoundingSphere();
					}
					const positions = layers[1].geometry.attributes.position;
					samples.forEach((i, k) => {
						const y = positions.getY(i);
						displacementVectors.setXYZ(k * 2, x(i), base[i], z(i));
						displacementVectors.setXYZ(k * 2 + 1, x(i), y, z(i));
						tangentVectors.setXYZ(k * 2, x(i), y, z(i));
						tangentVectors.setXYZ(
							k * 2 + 1,
							x(i) + 0.15,
							y + (positions.getY(i + 1) - positions.getY(i - 1)) * 0.38,
							z(i)
						);
					});
					for (let k = 0; k < 24; k++) {
						const i = (4 + Math.floor(k / 6) * 7) * NX + 3 + (k % 6) * 7;
						ties.setXYZ(k * 2, x(i), layers[0].geometry.attributes.position.getY(i), z(i));
						ties.setXYZ(k * 2 + 1, x(i), layers[2].geometry.attributes.position.getY(i), z(i));
					}
					displacementVectors.needsUpdate = tangentVectors.needsUpdate = ties.needsUpdate = true;
					updateBalls(dt);
					status.textContent = paused
						? 'Paused'
						: waves.length
							? 'Rippling'
							: energy > 0.003
								? 'Settling'
								: 'Settled';
				}
				function render() {
					const distance = Math.max(17.4, 15.4 / camera.aspect);
					scene.fog.near = distance;
					scene.fog.far = distance + 14;
					camera.position.set(
						distance * Math.sin(angle) * Math.cos(elevation),
						distance * Math.sin(elevation),
						distance * Math.cos(angle) * Math.cos(elevation)
					);
					camera.lookAt(0, -0.1, 0);
					renderer.render(scene, camera);
				}
				function resize() {
					renderer.setSize(innerWidth, innerHeight);
					const bottom =
						innerHeight - document.querySelector('footer').getBoundingClientRect().top + 18;
					const height = Math.max(100, innerHeight - bottom - 64);
					renderer.setViewport(0, bottom, innerWidth, height);
					camera.aspect = innerWidth / height;
					camera.updateProjectionMatrix();
					render();
				}
				function updatePause() {
					pause.textContent = paused ? 'Play' : 'Pause';
					pause.setAttribute('aria-pressed', String(paused));
					updateGeometry();
					render();
				}
				pause.addEventListener('click', () => {
					paused = !paused;
					updatePause();
				});
				evidence.addEventListener('click', addEvidence);
				reducedMotion.addEventListener('change', () => {
					paused = reducedMotion.matches;
					updatePause();
				});
				let drag = null;
				canvas.addEventListener('pointerdown', (e) => {
					drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
					canvas.setPointerCapture(e.pointerId);
				});
				canvas.addEventListener('pointermove', (e) => {
					if (!drag || drag.id !== e.pointerId) return;
					angle -= (e.clientX - drag.x) * 0.006;
					if (e.pointerType === 'mouse')
						elevation = Math.max(0.12, Math.min(1.15, elevation + (e.clientY - drag.y) * 0.004));
					drag = { id: e.pointerId, x: e.clientX, y: e.clientY };
					render();
				});
				canvas.addEventListener('lostpointercapture', () => {
					drag = null;
				});
				canvas.addEventListener('keydown', (e) => {
					if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
					e.preventDefault();
					if (e.key === 'ArrowLeft') angle -= 0.1;
					if (e.key === 'ArrowRight') angle += 0.1;
					if (e.key === 'ArrowUp') elevation = Math.min(1.15, elevation + 0.08);
					if (e.key === 'ArrowDown') elevation = Math.max(0.12, elevation - 0.08);
					render();
				});
				// The host suspends an offscreen iframe without destroying its persistent state.
				window.addEventListener('message', (e) => {
					if (
						e.origin === location.origin &&
						e.source === parent &&
						e.data?.type === 'inference-visibility'
					)
						visible = e.data.visible;
				});
				window.addEventListener('resize', resize);
				document.fonts.ready.then(resize);
				updateGeometry();
				updatePause();
				resize();
				let last = performance.now();
				renderer.setAnimationLoop((now) => {
					const dt = Math.min((now - last) / 1000, 0.04);
					last = now;
					if (paused || !visible || document.hidden) return;
					time += dt;
					if (time >= nextEvidence) addEvidence();
					const steps = Math.max(1, Math.ceil(dt * 2.4 * 120));
					for (let i = 0; i < steps; i++) step((dt * 2.4) / steps);
					if (!drag && !reducedMotion.matches) angle += dt * 0.095;
					updateGeometry(dt);
					render();
				});
				window.addEventListener(
					'pagehide',
					(event) => {
						if (event.persisted) return;
						renderer.setAnimationLoop(null);
						scene.traverse((object) => {
							object.geometry?.dispose();
							object.material?.dispose();
						});
						renderer.dispose();
					},
					{ once: true }
				);
			}
		</script>
	</body>
</html>
