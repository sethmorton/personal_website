<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #fafaf9; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; display: block; }
  .cap { display: none; }
</style>
</head>
<body>
<div>
<canvas id="c"></canvas>
<div class="cap">Earlier words feather forward along the grain into the next. Nothing runs back.</div>
</div>
<script>
const W = 640, H = 400, DPR = 2;
const c = document.getElementById('c'); c.width = W * DPR; c.height = H * DPR;
const g = c.getContext('2d'); g.scale(DPR, DPR);
let seed = 31; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v, smooth = u => u * u * (3 - 2 * u), sq = v => v * v;
const INK = [74, 106, 143], DEEP = [31, 79, 143], SKY = [110, 158, 206], PALE = [182, 194, 210], WARM = [201, 108, 62];
const lerp3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// ---- the words: three deposits on one baseline ----
const WORDS = ['THE', 'CAT', 'SAT'], FONT = '700 40px Georgia, serif', BASE = 214, CAP = 28, CX = [108, 306, 504];
const D = [0.3, 2.3, 4.3], SPREAD = 2.0, CYCLE = 11, FADE_AT = 10.0;
const mask = document.createElement('canvas'); mask.width = W; mask.height = H;
const mg = mask.getContext('2d'); mg.font = FONT; mg.textAlign = 'center'; mg.fillStyle = '#000';
const box = WORDS.map((w, k) => { const hw = mg.measureText(w).width / 2; mg.fillText(w, CX[k], BASE);
  return { x0: CX[k] - hw, x1: CX[k] + hw, y0: BASE - CAP, y1: BASE }; });
const M = mg.getImageData(0, 0, W, H).data, inMask = (x, y) => x >= 0 && y >= 0 && x < W && y < H && M[((y | 0) * W + (x | 0)) * 4 + 3] > 100;

// letter dots: the ink the nib actually laid down, the densest deposit
const dx = [], dy = [], dk = [], dor = [];
for (let r = 0, y = BASE - CAP - 2; y < BASE + 3; y += 1.7, r++) for (let x = 40 + (r & 1) * 0.85; x < W - 40; x += 1.7)
  if (inMask(x, y)) { let k = 0; while (k < 2 && x > (CX[k] + CX[k + 1]) / 2) k++;
    dx.push(x + (rnd() - 0.5) * 0.6); dy.push(y + (rnd() - 0.5) * 0.6); dk.push(k); dor.push((x - box[k].x0) / (box[k].x1 - box[k].x0)); }
const ND = dx.length;

// ---- the paper: thousands of short wavy fibres lying with the grain ----
const N = 24000, FX = new Float32Array(N * 4), FY = new Float32Array(N * 4), MX = new Float32Array(N), MY = new Float32Array(N);
const WGT = new Float32Array(N), PH = new Float32Array(N), LETT = new Float32Array(N), THR = new Float32Array(N * 3), CARRY = new Uint8Array(N);
// each stain is the union of a few overlapping ellipses around its word, stretched to the right; the edge is roughened by angular noise
const BLOB = WORDS.map((w, k) => { const b = box[k], cx = CX[k], cy = BASE - CAP / 2, hw = (b.x1 - b.x0) / 2, out = [];
  out.push([cx, cy, hw + 12, 34]);
  for (let j = 0; j < 4; j++) out.push([cx + (rnd() - 0.5) * hw * 1.4, cy + (rnd() - 0.5) * 22, 22 + rnd() * 22, 18 + rnd() * 16]);
  return out; });
const NOISE = [[rnd() * 6.283, rnd() * 6.283, rnd() * 6.283], [rnd() * 6.283, rnd() * 6.283, rnd() * 6.283], [rnd() * 6.283, rnd() * 6.283, rnd() * 6.283]];
for (let i = 0; i < N; i++) {
  const mx = rnd() * W, my = rnd() < 0.5 ? rnd() * H : 200 + (rnd() + rnd() + rnd() - 1.5) * 150;
  const L = 3.5 + rnd() * 8, a = (rnd() - 0.5) * 0.3, amp = 0.15 + rnd() * 0.45, ph = rnd() * 6.283;
  const ca = Math.cos(a), sa = Math.sin(a);
  for (let p = 0; p < 4; p++) { const s = (p / 3 - 0.5) * L, wv = Math.sin(ph + p * 2.1) * amp;
    FX[i * 4 + p] = mx + s * ca - wv * sa; FY[i * 4 + p] = my + s * sa + wv * ca; }
  MX[i] = mx; MY[i] = my; WGT[i] = 0.6 + rnd() * 0.75; PH[i] = ph;
  let best = 36;                                        // proximity to the written letters, 0..1 over 6 px
  if (my > BASE - CAP - 7 && my < BASE + 7) for (let oy = -6; oy <= 6; oy++) for (let ox = -6; ox <= 6; ox++) { const q = ox * ox + oy * oy;
    if (q < best && inMask(mx + ox, my + oy)) best = q; }
  LETT[i] = 1 - Math.sqrt(best) / 6;
  const jit = (0.86 + rnd() * 0.24) * (1 + 1.6 * Math.abs(a));   // off-grain fibres are reached later: the edge spikes along the grain
  for (let k = 0; k < 3; k++) {                         // normalised distance to the stain: 1 at the fully spread edge; ink runs with the grain, further right than left
    let d = 9; const nz = NOISE[k], ang = Math.atan2(my - (BASE - CAP / 2), mx - CX[k]);
    for (const [bx, by, hw, hh] of BLOB[k]) { const ddx = (mx - bx) / (mx > bx ? 1.4 : 0.95), ddy = my - by;
      d = Math.min(d, Math.hypot(ddx / hw, ddy / hh)); }
    const n = 1 + 0.13 * Math.sin(ang * 3 + nz[0]) + 0.08 * Math.sin(ang * 7 + nz[1]) + 0.05 * Math.sin(0.19 * my + 0.11 * mx + nz[2]);
    THR[i * 3 + k] = d * jit * n;
  }
  for (let p = 0; p < 2; p++) {                         // fibres that can carry a front from word p to word p+1
    const yc = BASE - 13 + Math.sin(mx * 0.045 + p) * 4, hh = 8 + rnd() * 10;
    if (Math.abs(my - yc) < hh && mx > CX[p] + 6 && mx < CX[p + 1] + 30 && rnd() < (p ? 0.85 : 0.4)) CARRY[i] |= 1 << p;
  }
}
// the dry sheet never changes: draw it once
const paper = document.createElement('canvas'); paper.width = W * DPR; paper.height = H * DPR;
{ const pg = paper.getContext('2d'); pg.scale(DPR, DPR); pg.lineWidth = 0.6; pg.lineCap = 'round'; pg.strokeStyle = 'rgba(182,194,210,0.17)'; pg.beginPath();
  for (let i = 0; i < N; i++) { const o = i * 4; pg.moveTo(FX[o], FY[o]); pg.lineTo(FX[o + 1], FY[o + 1]); pg.lineTo(FX[o + 2], FY[o + 2]); pg.lineTo(FX[o + 3], FY[o + 3]); }
  pg.stroke(); }
// fronts: THE -> CAT faint and early, CAT -> SAT carrying the warm accent
const FR = [{ t0: 3.2, t1: 4.1, xs: CX[0] + 6, xe: box[1].x0 + 4, warm: 0 }, { t0: 5.3, t1: 6.9, xs: CX[1] + 6, xe: box[2].x0 - 4, warm: 1 }];

// colour buckets: tint (sky -> ink -> deep) x warmth x alpha, so thousands of strokes become ~40 paths
const NT = 6, NW = 4, NA = 10, NK = NT * NW * NA, PAL = new Array(NK), CNT = new Int32Array(NK + 1), ORD = new Int32Array(N), KEY = new Int32Array(N);
for (let ti = 0; ti < NT; ti++) for (let wi = 0; wi < NW; wi++) for (let ai = 0; ai < NA; ai++) {
  const m = ti / (NT - 1), base = m < 0.5 ? lerp3(SKY, INK, m * 2) : lerp3(INK, DEEP, (m - 0.5) * 2), col = lerp3(base, WARM, wi / (NW - 1) * 0.85);
  PAL[(ti * NW + wi) * NA + ai] = `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${((ai + 0.5) / NA).toFixed(2)})`;
}

let marks = 0;
function draw(t) {
  g.clearRect(0, 0, W, H); marks = 0;
  const fade = t > FADE_AT ? 1 - clamp((t - FADE_AT) / 0.8) : 1;
  const U = [0, 0, 0], R = [0, 0, 0], DRY = [0, 0, 0], ABS = [0, 0, 0];
  for (let k = 0; k < 3; k++) { const u = (t - D[k]) / SPREAD; U[k] = u; R[k] = u <= 0 ? 0 : Math.min(1, Math.pow(u, 0.45));
    DRY[k] = clamp((t - D[k] - SPREAD - 0.2) / 1.4); }
  for (let p = 0; p < 2; p++) ABS[p + 1] = smooth(clamp((t - FR[p].t1) / 1.6));
  const XF = [0, 0];
  for (let p = 0; p < 2; p++) { const f = FR[p], u = clamp((t - f.t0) / (f.t1 - f.t0)); XF[p] = f.xs + (f.xe - f.xs) * (1 - Math.pow(1 - u, 1.6)); }
  const halo = smooth(clamp((t - FR[1].t1 - 0.3) / 1.9));

  CNT.fill(0);
  for (let i = 0; i < N; i++) {
    let q = 0, m = 0, w = 0;
    const lett = LETT[i];
    for (let k = 0; k < 3; k++) {
      if (U[k] <= 0) continue;
      const thr = THR[i * 3 + k], r = R[k], dry = DRY[k], ab = ABS[k];
      let qk = 0, mk = 0, wk = 0;
      if (thr <= r) {
        const rel = thr / r, rimb = Math.exp(-sq((rel - 0.94) / 0.06));
        qk = 0.17 + 0.16 * (1 - dry) + rimb * (0.25 + 0.4 * dry) + 0.5 * lett + 0.32 * ab * (1 - 0.25 * rel) * (1 - 0.7 * lett);
        if (U[k] < 1) qk += 0.3 * (1 - U[k]) * clamp((rel - 0.82) / 0.18);   // the wet advancing edge
        mk = 0.1 + 0.5 * dry + 0.3 * lett + 0.4 * rimb * dry + 0.35 * ab;
      } else if (k === 2 && halo > 0 && MX[i] > CX[2] - 16) {      // SAT's second halo: what CAT gave, blooming on the far side
        const side = clamp((MX[i] - CX[2] + 16) / 32), r2 = r * (1 + 0.3 * halo * side);
        if (thr <= r2) { const rel2 = (thr - r) / (r2 - r), rimb2 = Math.exp(-sq((rel2 - 0.85) / 0.12));
          qk = (0.24 + 0.5 * rimb2) * halo * side; mk = 0.9; wk = 0.32 * rimb2 * halo; }
      }
      if (qk > q) { q = qk; m = mk; w = wk; }
    }
    if (CARRY[i]) for (let p = 0; p < 2; p++) {
      if (!(CARRY[i] & (1 << p)) || t < FR[p].t0) continue;
      const f = FR[p], mx = MX[i], gap = XF[p] - mx; if (gap < 0) continue;
      const inDst = mx > box[p + 1].x0 - 30, ab = ABS[p + 1];
      const a = (0.45 + 0.55 * Math.exp(-gap / 40)) * (1 - 0.6 * ab) * (inDst ? 1 - ab : 1);   // the trail between the words stays, faintly
      const qb = a * (p ? 0.8 : 0.4), wb = f.warm * Math.exp(-gap / 40) * (1 - ab);
      if (qb > q) { q = qb; m = 0.1; w = wb; } else if (q > 0) { w = Math.max(w, wb * 0.8); }
    }
    q *= WGT[i] * fade;
    if (q < 0.05) { KEY[i] = -1; continue; }
    const ai = Math.min(NA - 1, q * NA | 0), ti = Math.min(NT - 1, clamp(m) * NT | 0), wi = Math.min(NW - 1, clamp(w) * NW | 0);
    KEY[i] = (ti * NW + wi) * NA + ai; CNT[KEY[i] + 1]++;
  }
  for (let k = 1; k <= NK; k++) CNT[k] += CNT[k - 1];
  const POS = CNT.slice();
  for (let i = 0; i < N; i++) if (KEY[i] >= 0) ORD[POS[KEY[i]]++] = i;

  g.drawImage(paper, 0, 0, W, H);
  // inked fibres, swelling a little and breathing while wet
  g.lineWidth = 0.75; g.lineCap = 'round';
  for (let key = 0; key < NK; key++) {
    const s = CNT[key], e = CNT[key + 1]; if (s === e) continue;
    g.strokeStyle = PAL[key]; g.beginPath();
    for (let j = s; j < e; j++) { const i = ORD[j], o = i * 4, ph = PH[i];
      let wob = 0; for (let k = 0; k < 3; k++) if (U[k] > 0 && THR[i * 3 + k] <= R[k] * 1.35) wob = Math.max(wob, 0.55 * (1 - DRY[k]) + 0.08);
      const ox = Math.sin(t * 1.1 + ph) * wob, oy = Math.cos(t * 0.9 + ph * 1.7) * wob;
      g.moveTo(FX[o] + ox, FY[o] + oy); g.lineTo(FX[o + 1] + ox, FY[o + 1] + oy); g.lineTo(FX[o + 2] + ox, FY[o + 2] + oy); g.lineTo(FX[o + 3] + ox, FY[o + 3] + oy); marks++; }
    g.stroke();
  }
  // the written letters: laid down left to right by the nib, settling from wet sky to dry deep ink
  for (let lv = 0; lv < 4; lv++) {
    const col = lerp3(SKY, DEEP, 0.25 + lv * 0.25); g.fillStyle = `rgba(${col[0] | 0},${col[1] | 0},${col[2] | 0},${(0.88 * fade).toFixed(2)})`;
    for (let i = 0; i < ND; i++) { const k = dk[i], rv = clamp((t - D[k] + 0.15) / 0.7); if (dor[i] > rv) continue;
      const dry = clamp((t - D[k] - 0.4) / 2.2), L = Math.min(3, (0.25 + dry * 0.75 + ABS[k] * 0.3) * 4 | 0); if (L !== lv) continue;
      const wob = 0.45 * (1 - dry), x = dx[i] + Math.sin(t * 1.3 + i) * wob, y = dy[i] + Math.cos(t + i * 0.7) * wob;
      g.fillRect(x - 1.25, y - 0.7, 2.5, 1.4); marks++; }
  }
  window.__marks = marks; window.__t = t;
}

const qs = new URLSearchParams(location.search), tq = parseFloat(qs.get('t'));
if (!isNaN(tq)) draw(tq % CYCLE);
else {
  let T = 0, last = performance.now();
  (function frame(now) { const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now; T += dt; draw(T % CYCLE); requestAnimationFrame(frame); })(last);
}
</script>
</body>
</html>
