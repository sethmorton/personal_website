<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f7f4ec; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; display: block; }
  .cap { display: none; }
</style>
</head>
<body>
<div>
<canvas id="c"></canvas>
<div class="cap">Everything upstream feeds the river. Nothing flows back up.</div>
</div>
<script>
const W = 640, H = 400, DPR = 2;
const c = document.getElementById('c'); c.width = W * DPR; c.height = H * DPR;
const g = c.getContext('2d'); g.scale(DPR, DPR);
let seed = 19; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const mix = (a, b, t) => `rgb(${a[0] + (b[0] - a[0]) * t | 0},${a[1] + (b[1] - a[1]) * t | 0},${a[2] + (b[2] - a[2]) * t | 0})`;
const INK = [40,97,122], DEEP = [35,72,95], SKY = [113,146,158], PALE = 'rgb(182,194,210)', WARM = [172,139,80];
const INKS = mix(INK, INK, 0), DEEPS = mix(DEEP, DEEP, 0), SKYS = mix(SKY, SKY, 0);
const BANKCOL = [], EDDYCOL = [];                       // bank: live ink -> frozen darker ink; eddy: sky -> warm
for (let i = 0; i <= 8; i++) { BANKCOL.push(mix(INK, [44, 84, 140], i / 8)); EDDYCOL.push(mix(SKY, WARM, i / 8)); }
const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v, smooth = u => u * u * (3 - 2 * u);

// ---- the watershed: 5 confluences on a meandering main stem, tributaries dropping in from both margins ----
const nodes = [[85, 205], [200, 185], [320, 215], [440, 190], [555, 205]], EXIT = [668, 198];
const WORDS = ['THE', 'CAT', 'SAT', 'ON', 'THE'], MHW = [5, 7.5, 10, 12.5, 15];   // main-stem half width at each node
const STEP = 1.3, tk = k => 1.9 + STEP * k, FRONT = 120;                          // front reaches node k at tk(k); px/s
const NS = 56, DENS = 0.085, chans = [];
function channel(P, hw0, hw1, k) {
  const FN = 240, fx = new Float32Array(FN), fy = new Float32Array(FN), fs = new Float32Array(FN); let L = 0;
  for (let i = 0; i < FN; i++) { const t = i / (FN - 1), m = 1 - t, a = m * m * m, b = 3 * m * m * t, cc = 3 * m * t * t, d = t * t * t;
    fx[i] = a * P[0] + b * P[2] + cc * P[4] + d * P[6]; fy[i] = a * P[1] + b * P[3] + cc * P[5] + d * P[7];
    if (i) L += Math.hypot(fx[i] - fx[i - 1], fy[i] - fy[i - 1]); fs[i] = L; }
  const px = new Float32Array(NS), py = new Float32Array(NS), nx = new Float32Array(NS), ny = new Float32Array(NS);
  for (let i = 0, j = 0; i < NS; i++) {                 // resample at equal arc length so s maps linearly onto the polyline
    const s = i / (NS - 1) * L; while (j < FN - 2 && fs[j + 1] < s) j++;
    const u = (s - fs[j]) / (fs[j + 1] - fs[j] || 1), j0 = Math.max(0, j - 2), j1 = Math.min(FN - 1, j + 3);
    px[i] = fx[j] + (fx[j + 1] - fx[j]) * u; py[i] = fy[j] + (fy[j + 1] - fy[j]) * u;
    const tx = fx[j1] - fx[j0], ty = fy[j1] - fy[j0], tl = Math.hypot(tx, ty) || 1; nx[i] = -ty / tl; ny[i] = tx / tl;
  }
  const n = Math.round(L * (hw0 + hw1) * DENS * (hw1 < 5 ? 1.7 : 1)), nSky = Math.round(n * 0.62);
  const lane = new Float32Array(n), v = new Float32Array(n), ph = new Float32Array(n), s0 = new Float32Array(n), sz = new Float32Array(n);
  for (let j = 0; j < n; j++) {
    lane[j] = j < nSky ? rnd() * 2 - 1 : (rnd() - 0.5) * 0.9;
    v[j] = 40 * (0.72 + 0.5 * (1 - Math.abs(lane[j]))) * (0.92 + rnd() * 0.16);  // the middle of the stream runs faster
    ph[j] = rnd() * 6.283; s0[j] = rnd() * L; sz[j] = j < nSky ? 1.3 + rnd() * 0.4 : 1.6 + rnd() * 0.5;
  }
  const nb = Math.floor(L / 4) * 2, bs = new Float32Array(nb), bside = new Int8Array(nb), bq = new Float32Array(nb);
  for (let i = 0; i < nb; i++) { bs[i] = 2 + (i >> 1) * 4; bside[i] = (i & 1) ? 1 : -1; bq[i] = rnd() * 6.283; }
  const b = tk(k), a = b - L / FRONT;
  chans.push({ px, py, nx, ny, L, hw0, hw1, k, a, b, n, nSky, lane, v, ph, s0, sz, nb, bs, bside, bq,
               bx: new Float32Array(nb), by: new Float32Array(nb), bm: new Uint8Array(nb) });
}
for (let k = 1; k < 5; k++) { const p = nodes[k - 1], q = nodes[k], d = (q[0] - p[0]) * 0.42;
  channel([p[0], p[1], p[0] + d, p[1], q[0] - d, q[1], q[0], q[1]], MHW[k - 1], MHW[k], k); }
{ const p = nodes[4], q = EXIT; channel([p[0], p[1], p[0] + 45, p[1], q[0] - 45, q[1], q[0], q[1]], MHW[4], 16.5, 5); }
for (const [k, top, x0] of [[0, 1, 14], [0, 0, 30], [1, 1, 92], [2, 0, 212], [2, 1, 238], [3, 1, 336], [4, 0, 452], [4, 1, 468]]) {
  const q = nodes[k], y0 = top ? -12 : H + 12, sg = top ? 1 : -1;   // tributaries: sweep in from the margins and bend into the flow
  channel([x0, y0, x0 + 24, y0 + sg * 72, q[0] - 62, q[1] - sg * 16, q[0] - 6, q[1] - sg * 1.5], 2.6, 4, k);
}
const hwAt = (ch, s) => ch.hw0 + (ch.hw1 - ch.hw0) * s / ch.L;
let AX = 0, AY = 0;
function at(ch, s, lat) {                               // point at arc length s, offset lat along the normal
  const f = s / ch.L * (NS - 1); let i = f | 0; if (i > NS - 2) i = NS - 2; const u = f - i;
  const nx = ch.nx[i] + (ch.nx[i + 1] - ch.nx[i]) * u, ny = ch.ny[i] + (ch.ny[i + 1] - ch.ny[i]) * u;
  AX = ch.px[i] + (ch.px[i + 1] - ch.px[i]) * u + nx * lat; AY = ch.py[i] + (ch.py[i + 1] - ch.py[i]) * u + ny * lat;
}
// bank dots: fixed homes; any that fall inside another channel's water are masked so confluences open cleanly
for (const ch of chans) for (let i = 0; i < ch.nb; i++) {
  at(ch, ch.bs[i], ch.bside[i] * hwAt(ch, ch.bs[i])); ch.bx[i] = AX; ch.by[i] = AY; if (ch.k === 5 && AX > 618) ch.bm[i] = 1;
  for (const o of chans) { if (o === ch || ch.bm[i]) continue;
    for (let m = 0; m < NS; m++) { const dx = AX - o.px[m], dy = AY - o.py[m], r = hwAt(o, m / (NS - 1) * o.L) - 0.4;
      if (dx * dx + dy * dy < r * r) { ch.bm[i] = 1; break; } } }
}

// ---- reveal downstream node by node once, then hold forever with the water still moving ----
const OUT = chans[4], EDDY = chans[1], T_EDDY = tk(2) + 0.9, T_HOLD = OUT.b + 0.4;
let T = 0, marks = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now; T += dt;
  const cyc = Math.min(T, T_HOLD), fade = 1;
  g.clearRect(0, 0, W, H); marks = 0; g.globalAlpha = fade;
  for (const ch of chans) {                             // banks: wobbling ink downstream of the front, frozen darker ink behind it
    const f = clamp((cyc - ch.a) / (ch.b - ch.a)); if (f <= 0) continue;
    const z = smooth(clamp((cyc - ch.b - 0.3) / 0.8)), wob = (1 - z) * 0.55, sz = 1.55 + z * 0.45, lim = f * ch.L;
    g.fillStyle = BANKCOL[z * 8 | 0];
    for (let i = 0; i < ch.nb; i++) { if (ch.bm[i] || ch.bs[i] > lim) continue; const q = ch.bq[i];
      g.fillRect(ch.bx[i] + Math.sin(T * 1.4 + q) * wob - sz / 2, ch.by[i] + Math.cos(T * 1.1 + q * 1.7) * wob - sz / 2, sz, sz); marks++; }
  }
  for (let pass = 0; pass < 2; pass++) {                // water: sky dots across the width, ink dots down the middle
    g.fillStyle = pass ? INKS : SKYS;
    for (const ch of chans) {
      const f = clamp((cyc - ch.a) / (ch.b - ch.a)); if (f <= 0) continue; const lim = f * ch.L;
      for (let j = pass ? ch.nSky : 0, e = pass ? ch.n : ch.nSky; j < e; j++) {
        const s = (ch.s0[j] + T * ch.v[j]) % ch.L; if (s > lim) continue;
        at(ch, s, ch.lane[j] * hwAt(ch, s) * 0.9 + Math.sin(T * 0.8 + ch.ph[j]) * 0.6);
        const sz = ch.sz[j]; g.fillRect(AX - sz / 2, AY - sz / 2, sz, sz); marks++;
      }
      if (f < 1) {                                       // the advancing front: a dense deep bar of dots at the tip
        g.fillStyle = DEEPS; const hw = hwAt(ch, lim);
        for (let q = 0; q < 11; q++) { const u = (q - 5) / 5.5, bk = (q * 37 % 11) * 1.1;
          at(ch, Math.max(0, lim - bk), u * hw + Math.sin(T * 1.3 + q) * 0.5); g.fillRect(AX - 1, AY - 1, 2, 2); marks++; }
        g.fillStyle = pass ? INKS : SKYS;
      }
    }
  }
  const te = cyc - T_EDDY;                              // the eddy: twelve dots at SAT swim toward CAT, tire, warm, wash back and dissolve
  if (te > 0 && te < 3.1) {
    const up = clamp(te / 1.5), e = 1 - Math.pow(1 - up, 3), back = Math.max(0, te - 1.5);
    g.fillStyle = EDDYCOL[up * 8 | 0]; g.globalAlpha = fade * (1 - smooth(clamp(back / 1.6)));
    for (let q = 0; q < 12; q++) {
      const s = Math.min(EDDY.L, EDDY.L - 5 - 56 * e + back * 34 + (q % 4) * 3.5), lane = ((q * 7) % 12 / 11 - 0.5) * 1.1;
      at(EDDY, s, lane * hwAt(EDDY, s) + Math.sin(T * 1.6 + q * 1.3) * 1.2 * (1 - up * 0.5));
      g.fillRect(AX - 1.4, AY - 1.4, 2.8, 2.8); marks++;
    }
    g.globalAlpha = fade;
  }
  if (cyc > OUT.b - 0.2) {                              // the mouth: a dotted arc where the river leaves the page, breathing
    const k = clamp((cyc - OUT.b + 0.2) / 0.6), blink = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(T * 2.2), 2);
    g.globalAlpha = fade * k * blink; g.fillStyle = INKS;
    at(OUT, OUT.L * 0.6, 0); const mx = AX, my = AY, r = hwAt(OUT, OUT.L * 0.6) * 1.4;
    for (let q = 0; q < 17; q++) { const a = -1.4 + 2.8 * q / 16, w = Math.sin(T * 1.2 + q * 0.9) * 0.5;
      g.fillRect(mx + Math.cos(a) * r * 0.6 + w - 1, my + Math.sin(a) * r + w - 1, 2, 2); marks++; }
    g.globalAlpha = fade;
  }
  g.font = '11px ui-monospace, Menlo, Consolas, monospace'; g.textAlign = 'center'; g.fillStyle = PALE;
  for (let k = 0; k < 5; k++) { const a = clamp((cyc - tk(k)) / 0.6); if (a <= 0) continue;
    g.globalAlpha = fade * a; g.fillText(WORDS[k], nodes[k][0], nodes[k][1] + MHW[k] + 22); }
  g.globalAlpha = 1;
  window.__marks = marks; window.__cyc = cyc;
  requestAnimationFrame(frame);
}
let last = performance.now();
requestAnimationFrame(frame);
</script>
</body>
</html>
