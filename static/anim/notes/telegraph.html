<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f7f4ec; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; display: block; }
  .cap { display: none; }
</style>
</head>
<body>
<div>
<canvas id="c" role="img" aria-label="The same lime discovery arrives simultaneously in two ink studies. Five isolated agents on the left relay progressively paler, distorted copies. Five connected nodes on the right all move together, settle within a second, and retain their changed positions and lime pigment."></canvas>
<div class="cap">A note must be reconstructed at every stop; a connected state changes together.</div>
</div>
<script>
const started = performance.now();
const W = 640, H = 400, D = 2, CYCLE = 10.3, DISCOVERY = 3.25;
const PAPER = '#f7f4ec', INK = '#28617a', DEEP = '#23485f', PALE = '#9badb0', LIME = '#ac8b50';
const c = document.getElementById('c'); c.width = W * D; c.height = H * D;
const g = c.getContext('2d', { willReadFrequently: true }); g.scale(D, D);
let seed = 731;
const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
const clamp = x => Math.max(0, Math.min(1, x));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const mix = (a, b, u) => a + (b - a) * u;
function layer(w = W, h = H) {
  const canvas = document.createElement('canvas'); canvas.width = w * D; canvas.height = h * D;
  const ctx = canvas.getContext('2d', { willReadFrequently: true }); ctx.scale(D, D); return { canvas, ctx };
}
function grain(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
const paper = layer();
paper.ctx.fillStyle = PAPER; paper.ctx.fillRect(0, 0, W, H);
paper.ctx.globalCompositeOperation = 'multiply'; paper.ctx.fillStyle = INK;
for (let i = 0; i < 19000; i++) {
  paper.ctx.globalAlpha = (8 + rnd() * 4) / 255;
  const radius = .12 + Math.abs(Math.sqrt(-2 * Math.log(Math.max(.0001, rnd()))) * .16);
  grain(paper.ctx, rnd() * W, rnd() * H, radius);
}
for (let i = 0; i < 180; i++) {
  const x = rnd() * W, y = rnd() * H;
  paper.ctx.strokeStyle = INK; paper.ctx.globalAlpha = .025; paper.ctx.lineWidth = .25;
  paper.ctx.beginPath(); paper.ctx.moveTo(x, y); paper.ctx.quadraticCurveTo(x + 2, y - 1, x + 4 + rnd() * 4, y + rnd()); paper.ctx.stroke();
}

// A wash beneath a sand-spline deposit, with paper holes and a sediment-rich lower edge.
function deposit(k) {
  const paint = layer(64, 64), wet = layer(64, 64), ctx = paint.ctx;
  for (let j = 0; j < 10; j++) {
    const x = 30 + (rnd() - .5) * 14, y = 32 + (rnd() - .5) * 21, r = 7 + rnd() * 9;
    const bloom = wet.ctx.createRadialGradient(x, y, .3, x, y, r);
    bloom.addColorStop(0, INK + '18'); bloom.addColorStop(.6, PALE + '32'); bloom.addColorStop(1, PALE + '00');
    wet.ctx.fillStyle = bloom; grain(wet.ctx, x, y, r);
  }
  for (let j = 0; j < 1850; j++) {
    const u = rnd() * 2 - 1, v = rnd() * 2 - 1;
    const edge = 1 + .17 * Math.sin(v * 8 + k) + .12 * Math.cos(v * 17 - k);
    if (u * u + v * v > edge || Math.abs(u + .17 * Math.sin(v * 8)) < .05 && v < .25) continue;
    const x = 32 + u * (12 + 2 * Math.sin(v * 7 + k)) + v * 2, y = 32 + v * 19;
    ctx.fillStyle = j % 11 === 0 ? PALE : j % 3 ? DEEP : INK;
    ctx.globalAlpha = (.16 + rnd() * .27) * (.7 + .3 * v);
    grain(ctx, x, y, .23 + rnd() * .63);
  }
  return { paint: paint.canvas, wet: wet.canvas };
}
const stains = Array.from({ length: 5 }, (_, k) => deposit(k));
const left = [[57, 221], [113, 216], [169, 221], [225, 216], [281, 223]];
const right = [[379, 211], [434, 129], [523, 163], [559, 256], [453, 288]];
const shift = [[-15, -29], [19, 18], [23, -15], [-22, -20], [21, -28]];
const edges = [[0, 1, 1], [0, 2, .8], [0, 3, .5], [0, 4, .9], [1, 2, .8], [1, 4, .6], [2, 3, .8], [2, 4, .45], [3, 4, .7]];
const degrees = right.map((_, i) => edges.reduce((sum, [a, b, w]) => sum + (a === i || b === i ? w : 0), 0));
const threads = edges.map(([a, b, weight], k) => ({ a, b, weight, bend: (k % 2 ? 1 : -1) * (5 + rnd() * 11), grains: Array.from({ length: 330 }, () => ({ u: rnd(), v: (rnd() + rnd() - 1) * .8, r: .18 + rnd() * .24, alpha: .17 + rnd() * .3 })) }));
const signal = Array.from({ length: 250 }, () => {
  const u = rnd(), v = (rnd() + rnd() - 1);
  return { u, x: (u - .5) * 17 + Math.sin(u * 5) * 3 + v * 2.7, y: -5 + Math.sin(u * 4) * 5 + v * (3 + 2 * u), r: .28 + rnd() * .65, rank: rnd() };
});
function settled(age) {
  const u = clamp(age / .95);
  return ease(u / .78) + .16 * Math.sin(u * Math.PI * 3) * Math.sin(u * Math.PI) ** 2;
}
function positions(t) {
  const q = settled(t - DISCOVERY);
  return right.map(([x, y], i) => [x + shift[i][0] * q, y + shift[i][1] * q]);
}
function inkNode(ctx, x, y, i, visibility, strength = 1, wetness = 0) {
  ctx.globalAlpha = visibility * (.55 + wetness * .2); ctx.drawImage(stains[i].wet, x - 32, y - 32, 64, 64);
  ctx.globalAlpha = visibility * strength; ctx.drawImage(stains[i].paint, x - 32, y - 32, 64, 64);
}
function mark(ctx, x, y, copy, reveal, connected = 1) {
  const retain = [1, .6, .32, .13, .025][copy];
  for (const p of signal) {
    if (p.u > reveal) continue;
    ctx.fillStyle = p.rank < retain * connected ? LIME : PALE;
    ctx.globalAlpha = .9;
    grain(ctx, x + p.x * (1 + copy * .11) + copy * .8 * Math.sin(p.u * 8), y + p.y + copy * 1.4, p.r * (1 - copy * .065));
  }
  ctx.globalAlpha = 1;
}
function web(ctx, t, opacity = 1) {
  const pts = positions(t), age = t - DISCOVERY;
  for (const s of threads) {
    const [ax, ay] = pts[s.a], [bx, by] = pts[s.b], dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
    const reveal = ease((t - .65 - (s.a + s.b) * .13) / 1.55);
    ctx.fillStyle = INK;
    for (const p of s.grains) {
      if (p.u > reveal) continue;
      const bow = Math.sin(p.u * Math.PI) * (s.bend + 3 * Math.sin(p.u * 11 + s.a) * Math.sin(Math.PI * clamp(age / .95)));
      ctx.globalAlpha = opacity * p.alpha * (.65 + .35 * s.weight);
      grain(ctx, mix(ax, bx, p.u) - dy / len * (bow + p.v), mix(ay, by, p.u) + dx / len * (bow + p.v), p.r);
    }
  }
  for (let i = 0; i < 5; i++) {
    const visible = ease((t - .15 - i * .45) / 1.2), response = ease(age / .45);
    inkNode(ctx, ...pts[i], i, opacity * visible, .65 + .35 * response, Math.sin(Math.PI * clamp(age / .95)));
  }
  ctx.globalAlpha = 1;
}

// Fixed 30 Hz paper-veiled history: seeking backwards replays exactly the same schedule.
const history = layer();
let historyStep = -1;
function replay(t) {
  const target = Math.min(45, Math.max(-1, Math.floor((t - DISCOVERY) * 30)));
  if (target < historyStep) { history.ctx.clearRect(0, 0, W, H); historyStep = -1; }
  while (historyStep < target) {
    historyStep++;
    history.ctx.globalCompositeOperation = 'destination-out';
    history.ctx.globalAlpha = 18 / 255; history.ctx.fillStyle = PAPER; history.ctx.fillRect(0, 0, W, H);
    history.ctx.globalCompositeOperation = 'source-over';
    web(history.ctx, DISCOVERY + historyStep / 30, .13);
  }
}
function relay(t) {
  const age = t - DISCOVERY;
  for (let i = 0; i < 5; i++) {
    const arrival = i === 0 ? 0 : i * .78;
    const receive = ease((age - arrival) / .24), visible = ease((t - .15 - i * .45) / 1.2);
    inkNode(g, ...left[i], i, visible, .47 + receive * (.53 * .64 ** i));
  }
  for (let i = 0; i < 4; i++) {
    const progress = (age - .25 - i * .78) / .53;
    if (progress <= 0 || progress >= 1) continue;
    const u = ease(progress), [ax, ay] = left[i], [bx, by] = left[i + 1];
    for (let ghost = 3; ghost >= 1; ghost--) {
      const old = ease(clamp(progress - ghost * .11));
      g.globalAlpha = .13 * (4 - ghost); g.drawImage(stains[i].paint, mix(ax, bx, old) - 6, mix(ay, by, old) - 13 - Math.sin(Math.PI * old) * 18, 12, 15);
    }
    g.save(); g.translate(mix(ax, bx, u), mix(ay, by, u) - 3 - Math.sin(Math.PI * u) * 18); g.scale(.6, .6);
    mark(g, 0, 0, i + 1, 1, .3); g.restore();
  }
  for (let i = 0; i < 5; i++) {
    const arrival = i === 0 ? 0 : i * .78;
    const reveal = ease((age - arrival) / .24);
    if (reveal > 0) mark(g, left[i][0] + i * 1.4, left[i][1] - 3, i, reveal);
  }
  g.globalAlpha = 1;
}
function draw(time) {
  const t = ((time % CYCLE) + CYCLE) % CYCLE; window.__t = t;
  g.globalAlpha = 1; g.drawImage(paper.canvas, 0, 0, W, H);
  replay(t);
  if (t >= DISCOVERY) {
    g.globalAlpha = 1 - ease((t - 4.2) / 1.3);
    g.drawImage(history.canvas, 325 * D, 70 * D, 285 * D, 260 * D, 325, 70, 285, 260);
  }
  web(g, t); relay(t);
  const pts = positions(t), age = t - DISCOVERY;
  for (let i = 0; i < 5; i++) {
    const reveal = ease(age / (i ? .5 : .24));
    if (reveal > 0) mark(g, pts[i][0], pts[i][1] - 3, 0, reveal, i ? degrees[i] / Math.max(...degrees) * .86 : 1);
  }
  g.globalAlpha = ease((t - 9.5) / .8); g.drawImage(paper.canvas, 0, 0, W, H); g.globalAlpha = 1;
}
const frozen = new URLSearchParams(location.search).get('t');
if (frozen !== null) draw(Number(frozen) || 0);
else {
  const epoch = performance.now();
  const tick = now => { draw((now - epoch) / 1000); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
window.__renderMs = performance.now() - started;
</script>
</body>
</html>
