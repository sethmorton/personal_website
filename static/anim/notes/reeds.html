<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f7f4ec; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; display: block; }
  .cap { display: none; }
</style>
</head>
<body>
<div>
<canvas id="c"></canvas>
<div class="cap">The same discovery, twice. Left, it is carried one pair of hands at a time. Right, the wind reaches every reed, and the field keeps the lean.</div>
</div>
<script>
const W = 640, H = 400, DPR = 2;
const c = document.getElementById('c'); c.width = W * DPR; c.height = H * DPR;
const g = c.getContext('2d'); g.scale(DPR, DPR);
const INK = 'rgb(74,106,143)', DEEP = 'rgb(31,79,143)', PALE = 'rgb(182,194,210)';
const ramp = (r, gg, b) => { const a = []; for (let i = 0; i <= 20; i++) a.push(`rgba(${r},${gg},${b},${(i / 20).toFixed(2)})`); return a; };
const SKYA = ramp(110, 158, 206), PALEA = ramp(182, 194, 210), WARMA = ramp(201, 108, 62);
const A = (arr, a) => arr[Math.round((a < 0 ? 0 : a > 1 ? 1 : a) * 20)];
let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const sm = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
let T = 0, dots = 0;

// every mark is a dot that walks a tiny slow loop; q decorrelates neighbours
function dot(x, y, s, q) {
  g.fillRect(x + Math.sin(T * 1.3 + q) * 0.5 - s / 2, y + Math.cos(T + q * 1.7) * 0.5 - s / 2, s, s); dots++;
}
function dotLine(x1, y1, x2, y2, sp, s, q) {
  const n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / sp));
  for (let k = 0; k < n; k++) { const t = (k + 0.5) / n; dot(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, s, q + k * 2.39); }
}

// ---- timeline: one cycle P. hop k lifts at S0 + k*HOP, lands CARRY later; the gust leaves the divider at S0 ----
const GY = 288, P = 8.6, S0 = 0.3, HOP = 1.4, CARRY = 1.1, TAKE = 0.8, DISSOLVE = 7.8, ARC = 40;

// ---- LEFT: six cairns, a bucket of dots handed down the line, two dots spilled at every handoff ----
const NC = 6, CX0 = 48, CSP = 45, STONES = [[30, 16], [22, 13], [14, 12]], CH = 41, TOP = GY - CH - 9;
function cairn(j, t, color) {
  const x = CX0 + j * CSP;
  let sh = 0;                                            // the receiving cairn shifts its stones to take the bucket in, and keeps a little of it
  if (j > 0) { const u = (t - (S0 + (j - 1) * HOP + CARRY)) / TAKE;
    if (u >= 0) sh = (u < 1 ? Math.sin(Math.PI * u) * 0.7 + 0.3 * sm(u) : 0.3) * 4 * (j & 1 ? 1 : -1); }
  g.fillStyle = color;
  let y = GY;
  for (let s = 0; s < 3; s++) {
    const w = STONES[s][0], h = STONES[s][1], dx = s === 2 ? sh : s === 1 ? -sh * 0.5 : 0;
    const x0 = x + dx - w / 2, x1 = x + dx + w / 2, q = j * 31 + s * 7;
    dotLine(x0, y, x1, y, 3.3, 1.5, q); dotLine(x1, y, x1, y - h, 3.3, 1.5, q + 1);
    dotLine(x1, y - h, x0, y - h, 3.3, 1.5, q + 2); dotLine(x0, y - h, x0, y, 3.3, 1.5, q + 3);
    y -= h;
  }
}
function bucket(cx, cy, n, alpha, spread) {
  g.fillStyle = A(SKYA, alpha);
  for (let k = 0; k < n; k++) {
    const a = k * 2.399 + T * (0.3 + (k % 3) * 0.12), r = (1.6 + (k % 5) * 1.5) * spread;
    g.fillRect(cx + Math.cos(a) * r - 1.2, cy + Math.sin(a) * r * 0.8 - 1.2, 2.4, 2.4); dots++;
  }
}
function trail(t) {                                      // the path already travelled: a pale dotted arc per completed hop
  g.fillStyle = A(PALEA, t > P - 0.6 ? (P - t) / 0.6 : 0.9);
  for (let k = 0; k < 5; k++) {
    const a = S0 + k * HOP + CARRY; if (t < a) break;
    for (let m = 1; m < 12; m++) { const e = m / 12; dot(CX0 + (k + e) * CSP, TOP - Math.sin(Math.PI * e) * ARC, 1.2, k * 17 + m * 2.39); }
  }
}
function spilled(t) {                                    // stateless: every handoff so far has dropped two dots that lie pale on the ground
  g.fillStyle = A(PALEA, t > P - 0.6 ? (P - t) / 0.6 : 1);
  for (let k = 0; k < 5; k++) {
    const a = S0 + k * HOP + CARRY; if (t < a) break;
    const u = Math.min(1, (t - a) / 1.8), x0 = CX0 + (k + 1) * CSP;
    for (let j = 0; j < 2; j++) { const side = j ? 1 : -1;
      dot(x0 + side * (9 + 10 * u) + Math.sin(u * 4 + k) * 2 * side, TOP + (GY - 2 - TOP) * Math.pow(u, 1.7), 1.9, k * 5 + j); }
  }
}
function left(t) {
  g.fillStyle = INK; dotLine(22, GY + 0.5, 298, GY + 0.5, 4, 1.3, 500);
  trail(t); spilled(t);
  let k = Math.floor((t - S0) / HOP); if (k > 4) k = 4;
  const u = k < 0 ? 2 : (t - S0 - k * HOP) / CARRY;     // u < 1: in the air between k and k+1; otherwise resting on k+1
  const holder = k < 0 ? 0 : u < 1 ? k : k + 1;
  for (let j = 0; j < NC; j++) cairn(j, t, j === holder ? DEEP : INK);
  if (k < 0) bucket(CX0, TOP, 14, 1, 1);
  else if (u < 1) { const e = sm(u); bucket(CX0 + (k + e) * CSP, TOP - Math.sin(Math.PI * e) * ARC, 14 - 2 * k, 1, 1); }
  else if (k === 4 && t > DISSOLVE) {                    // the last, thin message fades; a fresh full one gathers at the first cairn
    const v = (t - DISSOLVE) / (P - DISSOLVE);
    bucket(CX0 + 5 * CSP, TOP, 4, 1 - v, 1 + v * 0.6); bucket(CX0, TOP, 14, v, 1 + 3 * (1 - sm(v)));
  } else bucket(CX0 + (k + 1) * CSP, TOP, 14 - 2 * (k + 1), 1, 1);
}

// ---- RIGHT: a reed field. bend b: x = 0.7*b*h*s^2. gust = travelling gaussian front; 40% of every bend is kept ----
const NR = 110, bx = new Float32Array(NR), by = new Float32Array(NR), rh = new Float32Array(NR), rn = new Uint8Array(NR);
const base = new Float32Array(NR), cur = new Float32Array(NR), gmax = new Float32Array(NR), amp = new Float32Array(NR);
const ph = new Float32Array(NR), sw = new Float32Array(NR), rcol = [];
const CL = [372, 436, 520, 588];
for (let i = 0; i < NR; i++) {
  let x = rnd() < 0.5 ? 338 + rnd() * 288 : CL[i & 3] + (rnd() + rnd() - 1) * 40;   // half uniform, half bunched around four clumps
  x = Math.max(338, Math.min(626, x));
  const y = GY - 6 + rnd() * 18, h0 = 60 + rnd() * 90;
  bx[i] = x; by[i] = y; rh[i] = Math.min(h0, (634 - x) / 0.54, (x - 330) / 0.46);   // shorter at the panel edges so no lean ever leaves it
  rn[i] = 6 + Math.round(rh[i] / 5.5);
  base[i] = (rnd() - 0.5) * 0.12; cur[i] = base[i];
  amp[i] = (0.75 + rnd() * 0.4) * (0.65 + 0.35 * rh[i] / 150); ph[i] = rnd() * 6.28; sw[i] = 0.35 + rnd() * 0.4;
  rcol.push(`rgba(40,97,122,${(0.5 + (y - GY + 6) / 18 * 0.45).toFixed(2)})`);
}
const NGS = 170, gsx = new Float32Array(NGS), gsy = new Float32Array(NGS);
for (let i = 0; i < NGS; i++) { gsx[i] = 336 + rnd() * 292; gsy[i] = GY - 9 + rnd() * 24; }
const GA = 0.32, SIG = 42, VG = 120;
let cyc = -1, dir = 1;
function newCycle(cn) {                                  // fold the kept 40% into the resting lean; every 4th gust blows back from the right, 3x, so the books balance
  for (let i = 0; i < NR; i++) { base[i] += dir * 0.4 * gmax[i]; gmax[i] = 0; }
  cyc = cn; dir = cn % 4 === 3 ? -1 : 1;
}
function right(t, dt) {
  const tg = t - S0, xf = dir > 0 ? 320 + VG * tg : 640 - VG * tg, scale = dir > 0 ? 1 : 3, lag = 1 - Math.exp(-dt * 5);
  for (let i = 0; i < NR; i++) {
    let G = 0;
    if (tg > 0) { const d = (bx[i] - xf) / SIG; G = GA * scale * amp[i] * Math.exp(-d * d / 2); if (G > gmax[i]) gmax[i] = G; }
    const tgt = base[i] + dir * (0.6 * G + 0.4 * gmax[i]) + Math.sin(T * sw[i] + ph[i]) * 0.035;
    cur[i] += (tgt - cur[i]) * lag;
  }
  g.fillStyle = PALE;
  for (let i = 0; i < NGS; i++) dot(gsx[i], gsy[i], 1.2, i * 1.9);
  for (let i = 0; i < NR; i++) {
    const n = rn[i], h = rh[i], b = cur[i], x0 = bx[i], y0 = by[i];
    g.fillStyle = rcol[i];
    for (let k = 0; k < n; k++) {
      const s = k / (n - 1), q = i * 13 + k * 2.39;
      dot(x0 + 0.8 * b * h * s * s, y0 - h * s * (1 - 0.25 * b * b * s * s), k === n - 1 ? 2.2 : 1.6 - s * 0.5, q);
    }
  }
}
function leaves(t) {                                     // the accent: four warm specks riding the front
  const tg = t - S0; if (tg < 0 || tg > 3.4) return;
  const xf = dir > 0 ? 320 + VG * tg : 640 - VG * tg;
  g.fillStyle = A(WARMA, Math.min(1, tg * 2, (3.4 - tg) * 1.5));
  for (let j = 0; j < 4; j++) {
    const x = xf - dir * (6 + j * 9) + Math.sin(T * 0.9 + j) * 3, y = 250 - j * 13 + Math.sin(T * 1.3 + j * 1.9) * 8 + Math.sin(tg * 0.8 + j) * 12;
    if (x > 330 && x < 632) { g.fillRect(x - 1.1, y - 1.1, 2.2, 2.2); dots++; }
  }
}

function chrome() {
  g.fillStyle = PALE; dotLine(320, 120, 320, 340, 5, 1.2, 900);
  g.font = '9px ui-monospace, Menlo, monospace'; g.textBaseline = 'top'; g.letterSpacing = '2px';
  g.fillText('PASSING NOTES', 24, GY + 18); g.fillText('SPRINGS', 344, GY + 18);
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now; T += dt;
  const cn = Math.floor(T / P), t = T - cn * P;
  if (cn !== cyc) newCycle(cn);
  g.clearRect(0, 0, W, H); dots = 0;
  chrome(); left(t); right(t, dt); leaves(t);
  window.__T = T; window.__dots = dots;
  requestAnimationFrame(frame);
}
window.__frame = frame; requestAnimationFrame(frame);
</script>
</body>
</html>
