<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f7f4ec; }
  body { display: grid; place-items: center; width: 640px; height: 400px; overflow: hidden; }
  canvas { width: 640px; height: 400px; display: block; }
  .cap { display: none; }
</style>
</head>
<body>
<div>
<canvas id="c"></canvas>
<div class="cap">The same discovery, twice. Notes are relayed and rebuilt, hop by hop. A web feels the pull everywhere at once.</div>
</div>
<script>
const W = 640, H = 400, DPR = 2;
const c = document.getElementById('c'); c.width = W * DPR; c.height = H * DPR;
const g = c.getContext('2d'); g.scale(DPR, DPR);
let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const INK = [40,97,122], DEEP = [35,72,95], SKY = 'rgb(110,158,206)', PALE = 'rgb(182,194,210)', DEEPS = 'rgb(31,79,143)';
const mix = (a, b, t) => `rgb(${a[0] + (b[0] - a[0]) * t | 0},${a[1] + (b[1] - a[1]) * t | 0},${a[2] + (b[2] - a[2]) * t | 0})`;
const SHADE = []; for (let i = 0; i <= 16; i++) SHADE.push(mix(INK, DEEP, i / 16));     // ink -> deep, indexed by heat or strain
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const CYCLE = 8;
let T = 0, ct = 0, dots = 0;

// ---- LEFT: six islands. Four form a relay chain A->B->C->D; the other two never hear the news ----
const P = [[78, 96], [218, 84], [256, 214], [150, 292], [104, 192], [52, 336]], CHAIN = [0, 1, 2, 3];
const isl = P.map(([x, y]) => ({ x, y, R: 16 + rnd() * 4, a1: 0.12 + rnd() * 0.1, p1: rnd() * 6.28, a2: 0.08 + rnd() * 0.08, p2: rnd() * 6.28,
  ang: rnd() * 3.14, ang0: 0, ang1: 0, heat: 0, churn: 0 }));
const HOP = 2.2, FLY = 1.2, LIT = [0, 1.7, 3.9, 6.1], PEAK = [1, 0.78, 0.58, 0.42];    // arrival times, and how much survives each hop
const rad = (s, th) => s.R * (1 + s.a1 * Math.sin(2 * th + s.p1) + s.a2 * Math.sin(3 * th + s.p2));
function island(s, i) {
  const h = s.heat, sz = 1.45 + h * 0.6, wob = 0.4 + s.churn * 1.4, gap = 3.6 - h * 0.9;
  const ux = Math.cos(s.ang), uy = Math.sin(s.ang), Rm = s.R * 1.3;
  g.fillStyle = SHADE[h * 16 | 0];
  for (let so = -Rm, k = 0; so <= Rm; so += gap, k++) {                                // hatching: dotted parallel lines clipped to the blob
    const half = Math.sqrt(Rm * Rm - so * so);
    for (let t = -half; t <= half; t += 3) {
      const dx = ux * t - uy * so, dy = uy * t + ux * so;
      if (Math.hypot(dx, dy) > rad(s, Math.atan2(dy, dx))) continue;
      const q = k * 2.39 + t * 0.7 + i * 5;
      g.fillRect(s.x + dx + Math.sin(T * 1.3 + q) * wob - sz / 2, s.y + dy + Math.cos(T * 1.1 + q * 1.7) * wob - sz / 2, sz, sz); dots++;
    }
  }
  for (let m = 0; m < 44; m++) {                                                       // outline, finer dots
    const th = m / 44 * 6.283, r = rad(s, th) + 1.5, q = m * 1.7 + i;
    g.fillRect(s.x + Math.cos(th) * r + Math.sin(T * 1.2 + q) * 0.5 - 0.7, s.y + Math.sin(th) * r + Math.cos(T * 0.9 + q) * 0.5 - 0.7, 1.4, 1.4); dots++;
  }
}
function relay(dt) {
  for (let m = 0; m < 4; m++) {
    const s = isl[CHAIN[m]], a = ct - LIT[m], hot = a >= 0 && a < 1.8 ? PEAK[m] : 0, ch = m > 0 && a >= 0 && a < 1 ? 1 : 0;
    s.heat += (hot - s.heat) * (hot ? 6 : 0.6) * dt;
    s.churn += (ch - s.churn) * 5 * dt;
    if (m > 0 && a >= 0 && a <= 1) s.ang = s.ang0 + (s.ang1 - s.ang0) * ease(a);      // reconstruction: the hatching swings to a new angle
  }
}
function hop(k) {                                      // one relayed note: a faint arc and a short train of dots, shorter every hop
  const p = (ct - (0.5 + k * HOP)) / FLY; if (p <= 0 || p >= 1) return;
  const a = isl[CHAIN[k]], b = isl[CHAIN[k + 1]], dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
  const cx = (a.x + b.x) / 2 + dy / L * 48, cy = (a.y + b.y) / 2 - dx / L * 48;
  g.fillStyle = `rgba(155,173,176,${Math.sin(p * 3.1416).toFixed(2)})`;
  for (let m = 0; m < 34; m++) {
    const u = (m + 0.5) / 34, v = 1 - u, x = v * v * a.x + 2 * v * u * cx + u * u * b.x, y = v * v * a.y + 2 * v * u * cy + u * u * b.y;
    g.fillRect(x + Math.sin(T + m) * 0.6 - 0.6, y + Math.cos(T * 0.8 + m * 1.3) * 0.6 - 0.6, 1.2, 1.2); dots++;
  }
  g.fillStyle = SKY;
  const n = 10 - 2 * k, head = ease(p);
  for (let j = 0; j < n; j++) {
    const u = Math.max(0, head - j * 0.035), v = 1 - u, sz = 2.8 - j * 0.12;
    const x = v * v * a.x + 2 * v * u * cx + u * u * b.x, y = v * v * a.y + 2 * v * u * cy + u * u * b.y;
    g.fillRect(x + Math.sin(T * 2 + j) * 0.5 - sz / 2, y + Math.cos(T * 1.6 + j * 1.3) * 0.5 - sz / 2, sz, sz); dots++;
  }
}

// ---- RIGHT: a spider web. Verlet on the strand crossings; each strand is a spring that remembers the rest shape (as a vector, so a taut
// web spreads a pull everywhere, not just along one radial). Anchors pinned. The rest shape creeps toward what is: shapes accepted, never restored. ----
const HX = 478, HY = 200, NR = 9, NRING = 6, R0 = 24, DR = 19, A0 = 1 + NRING * NR, NN = A0 + NR;
const nx = new Float32Array(NN), ny = new Float32Array(NN), ox = new Float32Array(NN), oy = new Float32Array(NN);   // position, previous
const hx = new Float32Array(NN), hy = new Float32Array(NN), gx = new Float32Array(NR), gy = new Float32Array(NR);   // rest shape, anchor origins
nx[0] = HX; ny[0] = HY;
for (let j = 0; j < NRING; j++) for (let i = 0; i < NR; i++) {
  const r = R0 + (j + i / NR) * DR, th = i / NR * 6.283 + (rnd() - 0.5) * 0.06, q = 1 + j * NR + i;
  nx[q] = HX + Math.cos(th) * r; ny[q] = HY + Math.sin(th) * r;
}
for (let i = 0; i < NR; i++) { const r = 146 + (rnd() - 0.5) * 12, th = i / NR * 6.283 + (rnd() - 0.5) * 0.1; gx[i] = nx[A0 + i] = HX + Math.cos(th) * r; gy[i] = ny[A0 + i] = HY + Math.sin(th) * r; }
ox.set(nx); oy.set(ny); hx.set(nx); hy.set(ny);
const sa = [], sb = [], sw = [];                       // spring ends and stiffness: radials are the strong silk, the spiral is soft
for (let i = 0; i < NR; i++) {
  sa.push(0); sb.push(1 + i); sw.push(1);
  for (let j = 0; j < NRING - 1; j++) { sa.push(1 + j * NR + i); sb.push(1 + (j + 1) * NR + i); sw.push(1); }
  sa.push(1 + (NRING - 1) * NR + i); sb.push(A0 + i); sw.push(1);
}
for (let q = 1; q < A0 - 1; q++) { sa.push(q); sb.push(q + 1); sw.push(0.25); }         // the spiral: radius grows with q, so consecutive nodes
const NS = sa.length, strain = new Float32Array(NS), spd = new Float32Array(NN), kx = new Float32Array(NR), ky = new Float32Array(NR);   // kx/ky: where each twig holds its anchor
for (let i = 0; i < NR; i++) { kx[i] = gx[i]; ky[i] = gy[i]; }
let anc = -1, ax0 = 0, ay0 = 0, ax1 = 0, ay1 = 0;
function pull() {                                      // a new anchor is dragged 40 px and held; it never goes back, only wanders near its origin
  let i; do i = (rnd() * NR) | 0; while (i === anc); anc = i;
  ax0 = kx[i]; ay0 = ky[i];
  let k = 0;
  for (; k < 40; k++) {
    const a = rnd() * 6.283; ax1 = ax0 + Math.cos(a) * 40; ay1 = ay0 + Math.sin(a) * 40;
    if (ax1 > 332 && ax1 < 634 && ay1 > 34 && ay1 < 366 && Math.hypot(ax1 - gx[i], ay1 - gy[i]) < 55) break;
  }
  if (k === 40) { const d = Math.hypot(gx[i] - ax0, gy[i] - ay0); ax1 = ax0 + (gx[i] - ax0) / d * 40; ay1 = ay0 + (gy[i] - ay0) / d * 40; }
}
function web(dt) {
  const e = ease(ct / 1.4); kx[anc] = ax0 + (ax1 - ax0) * e; ky[anc] = ay0 + (ay1 - ay0) * e;
  for (let n = 0; n < NN; n++) { const vx = (nx[n] - ox[n]) * 0.78, vy = (ny[n] - oy[n]) * 0.78; ox[n] = nx[n]; oy[n] = ny[n]; nx[n] += vx; ny[n] += vy; }
  for (let it = 0; it < 6; it++) {
    for (let s = 0; s < NS; s++) {
      const a = sa[s], b = sb[s], ex = (nx[b] - hx[b] - nx[a] + hx[a]) * 0.175 * sw[s], ey = (ny[b] - hy[b] - ny[a] + hy[a]) * 0.175 * sw[s];
      nx[a] += ex; ny[a] += ey; nx[b] -= ex; ny[b] -= ey;
    }
    for (let i = 0; i < NR; i++) { const q = A0 + i; nx[q] += (kx[i] - nx[q]) * 0.3; ny[q] += (ky[i] - ny[q]) * 0.3; }   // twigs bend a little
  }
  for (let n = 0; n < NN; n++) {                       // speed (px/s) so anything moving darkens; then rest shape creeps toward what is
    spd[n] = Math.hypot(nx[n] - ox[n], ny[n] - oy[n]) * 60;
    hx[n] += (nx[n] - hx[n]) * 0.7 * dt; hy[n] += (ny[n] - hy[n]) * 0.7 * dt;
  }
  for (let s = 0; s < NS; s++) {
    const a = sa[s], b = sb[s], ex = nx[b] - hx[b] - nx[a] + hx[a], ey = ny[b] - hy[b] - ny[a] + hy[a];
    strain[s] = Math.max(Math.hypot(ex, ey) / Math.hypot(hx[b] - hx[a], hy[b] - hy[a]) * 6, (spd[a] + spd[b]) * 0.07);   // 0..1 emphasis
  }
}
function strand(s) {                                   // strained or moving strands draw denser, darker, heavier
  const a = sa[s], b = sb[s], st = Math.min(1, strain[s]), x1 = nx[a], y1 = ny[a], x2 = nx[b], y2 = ny[b];
  const L = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.round(L / 3.1 * (1 + st))), sz = 1.4 + st * 0.7;
  g.fillStyle = SHADE[st * 16 | 0];
  for (let k = 0; k < n; k++) {
    const t = (k + 0.5) / n, q = s * 0.618 + k * 2.39;
    g.fillRect(x1 + (x2 - x1) * t + Math.sin(T * 1.4 + q) * 0.55 - sz / 2, y1 + (y2 - y1) * t + Math.cos(T * 1.1 + q * 1.7) * 0.55 - sz / 2, sz, sz); dots++;
  }
}
function knots() {                                     // hub and anchors: small dark clusters; the freshly pulled anchor and island A carry a warm speck
  g.fillStyle = DEEPS;
  for (let n = -1; n < NR; n++) {
    const q = n < 0 ? 0 : A0 + n, m = n < 0 ? 7 : 4;
    for (let k = 0; k < m; k++) { const a = k * 2.399 + T * 0.5, r = 1.5 + (k % 3) * 1.1; g.fillRect(nx[q] + Math.cos(a) * r - 1, ny[q] + Math.sin(a) * r - 1, 2, 2); dots++; }
  }
  if (ct > 3.5) return;
  g.fillStyle = `rgba(172,139,80,${(1 - ct / 3.5).toFixed(2)})`;
  const A = isl[CHAIN[0]], q = A0 + anc;
  for (let k = 0; k < 3; k++) {
    const a = k * 2.094 + T * 0.7, r = 3 + Math.sin(T * 1.5 + k) * 0.6;
    g.fillRect(A.x + Math.cos(a) * r - 1.1, A.y + Math.sin(a) * r - 1.1, 2.2, 2.2);
    g.fillRect(nx[q] + Math.cos(a + 1) * r - 1.1, ny[q] + Math.sin(a + 1) * r - 1.1, 2.2, 2.2); dots += 2;
  }
}
function furniture() {
  g.fillStyle = PALE;
  for (let y = 44; y < 364; y += 7) { g.fillRect(320 + Math.sin(T * 0.8 + y * 0.3) * 0.5 - 0.6, y - 0.6, 1.2, 1.2); dots++; }
  g.font = '9px ui-monospace, Menlo, monospace'; g.letterSpacing = '2px'; g.textBaseline = 'top';
  g.textAlign = 'left'; g.fillText('PASSING NOTES', 16, 16); g.textAlign = 'right'; g.fillText('SPRINGS', 626, 16);
}

pull();
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.033, (now - last) / 1000)); last = now; T += dt;
  const pc = ct; ct = T % CYCLE;
  if (ct < pc) pull();                                  // new cycle: A lights and an anchor is pulled in the same instant
  for (let m = 1; m < 4; m++) if (pc < LIT[m] && ct >= LIT[m]) { const s = isl[CHAIN[m]]; s.ang0 = s.ang; s.ang1 = s.ang + (rnd() - 0.5) * 1.6; }
  relay(dt); web(dt);
  g.clearRect(0, 0, W, H); dots = 0;
  furniture();
  for (let i = 0; i < 6; i++) island(isl[i], i);
  for (let k = 0; k < 3; k++) hop(k);
  for (let s = 0; s < NS; s++) strand(s);
  knots();
  window.__dots = dots; window.__T = T;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
