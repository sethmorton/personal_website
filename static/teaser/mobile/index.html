<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>The Shape of Inference: mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>html, body { margin: 0; background: #fafaf9; } body { width: 1080px; height: 1080px; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<script>
// A Calder mobile as a whole-system solver. One small gold weight lands on one arm at 1s; every rod, filament,
// counterweight and card re-solves at once (tilt, yaw, sway, all coupled both ways), settling to a new balance
// by ~7.5s. From 8.5s the weight fades and the pose blends back to the periodic idle for a seamless loop.
const W = 1080, DUR = 10, DT = 1 / 240, G = 9.81, CPL = .42;
const PAPER = '#fafaf9', INK = '#4a6a8f', DEEP = '#1f4f8f', PALE = '#b6c2d2', BRASS = '#b08a3c', GOLD = '#e6aa32', VERM = '#e23b2a';
let seed = 1965; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
const clamp = x => Math.max(0, Math.min(1, x)), ease = x => { x = clamp(x); return x * x * (3 - 2 * x); }, mix = (a, b, u) => a + (b - a) * u;
const rad = d => d * Math.PI / 180, TAU = Math.PI * 2;

// ---- spec: rod(len, pivotRise, filament, yaw, left, right); objects carry mass, size, filament, yaw ----
const rod = (len, h, fil, yaw, left, right) => ({ rod: true, len, h, fil, yaw0: rad(yaw), left, right });
const obj = (kind, m, fil, yaw, o) => ({ kind, m, fil, yaw0: rad(yaw), e: .015, ...o });
const brass = (m, r, fil, yaw) => obj('brass', m, fil, yaw, { r });
const paper = (shape, color, m, s, fil, yaw) => obj('paper', m, fil, yaw, { shape, color, s, r: s });
const card = (plate, m, fil, yaw, e) => obj('card', m, fil, yaw, { plate, r: .16, e, w: .26, hgt: .32 });
const glyph = (ch, m, s, fil, yaw) => obj('glyph', m, fil, yaw, { ch, s, r: s * .5 });
const TREE = rod(1.5, .18, .45, 24,
  rod(1.0, .12, .3, 62,
    rod(.5, .07, .26, 10, brass(.9, .06, .3, 0), paper('crescent', GOLD, .2, .13, .34, 40)),
    Object.assign(rod(.7, .09, .32, -30, paper('leaf', VERM, .25, .17, .3, -10),
      rod(.45, .06, .26, 48, rod(.3, .04, .22, -8, paper('disc', GOLD, .1, .07, .3, 30), paper('tri', VERM, .06, .07, .24, -50)), glyph('?', .12, .2, .3, 20))), { drop: .25 })),
  rod(1.1, .14, .3, -42,
    rod(.6, .08, .34, 28,
      rod(.5, .06, .28, -58,
        rod(.35, .04, .24, 20, card('penzias', .3, .32, 165, .07), brass(.35, .045, .28, 0)),
        rod(.35, .04, .26, 70, glyph('&', .1, .18, .3, -30), rod(.28, .03, .22, -18, paper('blob', VERM, .08, .09, .26, 60), glyph('¶', .05, .12, .3, 10)))),
      brass(.6, .055, .3, 0)),
    rod(.6, .07, .38, 8, card('pigeon', .4, .34, 30, .04), glyph(';', .08, .16, .3, -20))));
const HOOK = [0, 1.85, 0], DROP = { m: .04, r: .04 };

const nodes = [];
(function build(n, parent, side) {
  n.parent = parent; n.side = side; n.id = nodes.length; nodes.push(n);
  if (n.rod) { n.L = build(n.left, n.id, 0); n.R = build(n.right, n.id, 1); }
  return n.id;
})(TREE, -1, 0);
for (const n of [...nodes].reverse()) {           // masses bottom-up, arms balanced exactly, damping from natural frequency
  if (!n.rod) { n.M = n.m; continue; }
  const l = nodes[n.L], r = nodes[n.R]; n.mr = .02 * n.len; n.M = l.M + r.M + n.mr;
  n.a = n.len * (r.M + n.mr / 2) / n.M; n.b = n.len - n.a;
  const I = l.M * n.a * n.a + r.M * n.b * n.b + n.mr * n.len * n.len / 12;
  n.cth = 2 * .42 * Math.sqrt(n.M * G * n.h / I); n.cps = .35; n.kt = .03;
  if (n.drop) DROP.rod = n.id;
}
for (let n = nodes[DROP.rod]; n; n = nodes[n.parent]) n.dropPath = true;
const N = nodes.length;
for (const n of nodes) {                          // idle: minute periodic sway with whole cycles per loop
  n.k = [1 + (rnd() * 3 | 0), 1 + (rnd() * 3 | 0), 2 + (rnd() * 3 | 0)].map(k => TAU * k / DUR);
  n.ph = [rnd() * TAU, rnd() * TAU, rnd() * TAU];
  n.bth = rad(.25); n.bps = rad(n.rod ? 1.2 + rnd() * 1.5 : 2 + rnd() * 2); n.bs = rad(.35);
  n.cs = n.kind === 'paper' || n.kind === 'card' ? 2.6 : 1.4;
}
const state = () => ({ th: new Float64Array(N), ps: new Float64Array(N), sx: new Float64Array(N), sz: new Float64Array(N) });
const vec = () => new Float64Array(3 * N);
function baseline(t, o) {
  for (const n of nodes) {
    const i = n.id;
    o.th[i] = n.rod ? n.bth * Math.sin(n.k[0] * t + n.ph[0]) : 0;
    o.ps[i] = n.yaw0 + n.bps * Math.sin(n.k[1] * t + n.ph[1]);
    o.sx[i] = n.bs * Math.sin(n.k[2] * t + n.ph[2]); o.sz[i] = n.bs * .7 * Math.cos(n.k[2] * t + n.ph[2]);
  }
}
function fk(S, P, EL, ER) {                        // pivot P and rod ends from angles; rods are shallow V's rising h at the pivot
  for (const n of nodes) {
    const i = n.id, o = 3 * i, p = n.parent, top = p < 0 ? HOOK : n.side ? ER : EL, q = p < 0 ? 0 : 3 * p;
    const sx = S.sx[i], sz = S.sz[i], f = n.fil;
    P[o] = top[q] + f * sx; P[o + 1] = top[q + 1] - f * Math.sqrt(Math.max(0, 1 - sx * sx - sz * sz)); P[o + 2] = top[q + 2] + f * sz;
    if (!n.rod) continue;
    const c = Math.cos(S.th[i]), s = Math.sin(S.th[i]), cp = Math.cos(S.ps[i]), sp = Math.sin(S.ps[i]), h = n.h;
    let x = -n.a * c + h * s, y = -n.a * s - h * c;
    EL[o] = P[o] + x * cp; EL[o + 1] = P[o + 1] + y; EL[o + 2] = P[o + 2] + x * sp;
    x = n.b * c + h * s; y = n.b * s - h * c;
    ER[o] = P[o] + x * cp; ER[o + 1] = P[o + 1] + y; ER[o + 2] = P[o + 2] + x * sp;
  }
}

// ---- simulation, precomputed once at load, recorded per step ----
const S = state(), V = state(), P = vec(), EL = vec(), ER = vec(), P1 = vec(), P2 = vec(), EL1 = vec(), EL2 = vec(), ER1 = vec(), ER2 = vec();
const STEPS = Math.round(DUR / DT), REC = new Float32Array((STEPS + 1) * N * 4);
const landing = t => ease((t - 1) / .12);
function step(t) {
  fk(S, P, EL, ER);
  const land = landing(t), idt2 = 1 / (DT * DT), acc = (A, A1, A2, o) => (A[o] - 2 * A1[o] + A2[o]) * idt2 * CPL;
  for (const n of nodes) {
    const i = n.id, o = 3 * i, p = n.parent, q = 3 * p;
    const aPx = acc(P, P1, P2, o), aPy = acc(P, P1, P2, o + 1), aPz = acc(P, P1, P2, o + 2);
    const T = n.side ? ER : EL, T1 = n.side ? ER1 : EL1, T2 = n.side ? ER2 : EL2;
    const aTx = p < 0 ? 0 : acc(T, T1, T2, q), aTz = p < 0 ? 0 : acc(T, T1, T2, q + 2);
    const f = n.fil;
    V.sx[i] += DT * (-(G / f) * S.sx[i] - aTx / f - n.cs * V.sx[i]);
    V.sz[i] += DT * (-(G / f) * S.sz[i] - aTz / f - n.cs * V.sz[i]);
    const ps = S.ps[i], dx = Math.cos(ps), dz = Math.sin(ps), nx = -dz, nz = dx, aPd = aPx * dx + aPz * dz, aPn = aPx * nx + aPz * nz;
    if (!n.rod) { V.ps[i] += DT * (-n.e * aPn / (n.e * n.e + n.r * n.r) - .3 * V.ps[i] - .05 * (ps - n.yaw0)); continue; }
    const th = S.th[i], c = Math.cos(th), s = Math.sin(th), gE = G + aPy;
    let tau = 0, tauP = 0, I = n.mr * n.len * n.len / 12 + 1e-4, IP = I;
    for (let e = 0; e < 2; e++) {
      const ch = nodes[e ? n.R : n.L], sa = e ? n.b : -n.a, Wm = ch.M + (ch.dropPath ? DROP.m * land : 0);
      const x = sa * c + n.h * s, y = sa * s - n.h * c;
      const Fx = Wm * G * S.sx[ch.id], Fz = Wm * G * S.sz[ch.id];       // pull of the child's swung filament
      const Fd = Fx * dx + Fz * dz - Wm * aPd, Fn = Fx * nx + Fz * nz - Wm * aPn;
      tau += -x * Wm * gE - y * Fd; tauP += x * Fn; I += Wm * (x * x + y * y); IP += Wm * x * x;
    }
    tau += -((n.b - n.a) / 2 * c + n.h * s) * n.mr * gE;
    if (n.drop && land > 0) {
      const m = DROP.m * land, x = n.drop * c + (n.h - DROP.r) * s, y = n.drop * s - (n.h - DROP.r) * c;
      tau += -x * m * gE + y * m * aPd; tauP += -x * m * aPn; I += m * (x * x + y * y); IP += m * x * x;
    }
    V.th[i] += DT * (tau / I - n.cth * V.th[i]);
    V.ps[i] += DT * (tauP / IP - n.kt * (ps - n.yaw0) - n.cps * V.ps[i]);
  }
  for (const k of ['th', 'ps', 'sx', 'sz']) for (let i = 0; i < N; i++) S[k][i] += DT * V[k][i];
  P2.set(P1); P1.set(P); EL2.set(EL1); EL1.set(EL); ER2.set(ER1); ER1.set(ER);
}
(function simulate() {
  const B0 = state(), B1 = state(), h = 1e-4; baseline(0, B0); baseline(h, B1);
  for (const k of ['th', 'ps', 'sx', 'sz']) for (let i = 0; i < N; i++) { S[k][i] = B0[k][i]; V[k][i] = (B1[k][i] - B0[k][i]) / h; }
  fk(S, P, EL, ER); P1.set(P); P2.set(P); EL1.set(EL); EL2.set(EL); ER1.set(ER); ER2.set(ER);
  for (let k = 0; k <= STEPS; k++) {
    const o = k * N * 4;
    for (let i = 0; i < N; i++) { REC[o + 4 * i] = S.th[i]; REC[o + 4 * i + 1] = S.ps[i]; REC[o + 4 * i + 2] = S.sx[i]; REC[o + 4 * i + 3] = S.sz[i]; }
    step(k * DT);
  }
})();

// ---- paper: base sheet and a grain overlay that sits over everything ----
const layer = () => { const l = document.createElement('canvas'); l.width = l.height = W; return l.getContext('2d'); };
const sheet = layer(), grain = layer(), shadow = layer();
sheet.fillStyle = PAPER; sheet.fillRect(0, 0, W, W);
for (const [g, count, lo, hi] of [[sheet, W * W * .05, 7, 12], [grain, W * W * .03, 9, 20]]) {
  g.fillStyle = INK; g.globalCompositeOperation = 'multiply';
  for (let j = 0; j < count; j++) {
    g.globalAlpha = (lo + rnd() * (hi - lo)) / 255;
    const r = .15 + Math.abs(rnd() + rnd() + rnd() - 1.5) * .6;
    g.beginPath(); g.arc(rnd() * W, rnd() * W, r, 0, TAU); g.fill();
  }
}

// ---- cut-paper outlines in local (u, v) units, hanging below the pivot at v = 0 ----
const poly = (fn, n = 40) => Array.from({ length: n }, (_, i) => fn(i / n * TAU));
const SHAPES = {
  disc: poly(a => [Math.cos(a), -1 - Math.sin(a) * .95]),
  leaf: poly(a => { const r = .62 + .38 * Math.cos(a) + .18 * Math.cos(3 * a); return [Math.sin(a) * r * .7, -1.05 - Math.cos(a) * r]; }, 64),
  crescent: [...poly(a => [Math.cos(a), -1 - Math.sin(a)], 48).slice(4, 45), ...poly(a => [.42 + .75 * Math.cos(a), -1.08 - .75 * Math.sin(a)], 48).slice(5, 43).reverse()],
  tri: poly(a => { const k = Math.cos(3 * a); return [Math.sin(a) * (1 - .18 * k), -1 - Math.cos(a) * (1 - .18 * k)]; }, 60),
  blob: poly(a => { const r = .8 + .3 * Math.sin(5 * a + .4) + .1 * Math.sin(2 * a); return [Math.cos(a) * r, -1 - Math.sin(a) * r]; }, 96)
};

const c = document.getElementById('c'), g = c.getContext('2d');
const plates = {};
const F = W / 2.9 * 9, TARGET = [.1, .32, 0];
let cam, ca, sa;
const project = (x, y, z) => {
  const qx = x - cam[0], qy = y - cam[1], qz = z - cam[2], xc = qx * ca - qz * sa, d = -(qx * sa + qz * ca);
  return [W / 2 + F * xc / d, W / 2 - F * qy / d, d];
};
const near = d => clamp((9.7 - d) / 1.6);

const RS = state(), RB = state(), RP = vec(), REL = vec(), RER = vec();
window.render = t => {
  t = (t % DUR + DUR) % DUR;
  const k = Math.min(STEPS - 1, t / DT | 0), u = t / DT - k, o0 = k * N * 4, o1 = o0 + N * 4, bl = ease((t - 8.5) / 1.5);
  baseline(t, RB);
  ['th', 'ps', 'sx', 'sz'].forEach((key, j) => { for (let i = 0; i < N; i++) RS[key][i] = mix(mix(REC[o0 + 4 * i + j], REC[o1 + 4 * i + j], u), RB[key][i], bl); });
  fk(RS, RP, REL, RER);
  const al = rad(7.5) * Math.sin(TAU * t / DUR); ca = Math.cos(al); sa = Math.sin(al);
  cam = [TARGET[0] + 9 * sa, TARGET[1], TARGET[2] + 9 * ca];
  const prims = [];
  const line = (A, B, w, color, alpha) => (x, sh) => {
    const a = project(A[0], A[1], A[2]), b = project(B[0], B[1], B[2]);
    x.lineWidth = w * F / a[2]; x.strokeStyle = sh ? DEEP : color; x.globalAlpha = sh ? alpha * .5 : alpha; x.lineCap = 'round';
    x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke(); x.globalAlpha = 1;
  };
  const ball = (C, r, color, dark, alpha) => (x, sh) => {
    const p = project(C[0], C[1], C[2]), R = r * F / p[2];
    x.globalAlpha = alpha; x.fillStyle = sh ? DEEP : color; x.beginPath(); x.arc(p[0], p[1], R, 0, TAU); x.fill();
    if (sh) { x.globalAlpha = 1; return; }
    x.save(); x.clip(); x.fillStyle = dark; x.beginPath(); x.arc(p[0] + R * .38, p[1] + R * .38, R, 0, TAU); x.fill();
    x.fillStyle = PAPER; x.globalAlpha = alpha * .55; x.beginPath(); x.arc(p[0] - R * .38, p[1] - R * .4, R * .2, 0, TAU); x.fill(); x.restore(); x.globalAlpha = 1;
  };
  const frame = n => {
    const i = n.id, o = 3 * i, turn = n.plate === 'penzias' ? -rad(165) * ease((t - 1) / 4.5) * (1 - ease((t - 8.1) / 1.2)) : 0, ps = RS.ps[i] + turn;
    return { O: [RP[o], RP[o + 1], RP[o + 2]], U: [Math.cos(ps), 0, Math.sin(ps)], V: [0, 1, 0] };
  };
  const at = (fr, u, v) => project(fr.O[0] + u * fr.U[0], fr.O[1] + v, fr.O[2] + u * fr.U[2]);
  const affine = (x, fr, s) => {                    // canvas transform: local (u, v) in units of s -> screen
    const o = at(fr, 0, 0), a = at(fr, s, 0), b = at(fr, 0, -s);
    x.setTransform(a[0] - o[0], a[1] - o[1], b[0] - o[0], b[1] - o[1], o[0], o[1]);
  };
  for (const n of nodes) {
    const i = n.id, o = 3 * i, p = n.parent, top = p < 0 ? HOOK : (n.side ? RER : REL).subarray(3 * p, 3 * p + 3), Pv = RP.subarray(o, o + 3);
    prims.push({ z: (project(...top)[2] + project(...Pv)[2]) / 2, draw: line(top, Pv, .0024, INK, .8) });
    const fr = frame(n), z = project(...Pv)[2];
    if (n.rod) {
      prims.push({ z, draw: (x, sh) => {
        line(Pv, REL.subarray(o, o + 3), .011, DEEP, 1)(x, sh); line(Pv, RER.subarray(o, o + 3), .011, DEEP, 1)(x, sh);
        const q = project(...Pv), R = .014 * F / q[2]; x.lineWidth = R * .5; x.strokeStyle = DEEP; x.beginPath(); x.arc(q[0], q[1] - R, R, 0, TAU); x.stroke();
      } });
      if (n.drop) {
        const th = RS.th[i], c_ = Math.cos(th), s_ = Math.sin(th), x = n.drop * c_ + (n.h - DROP.r) * s_, y = n.drop * s_ - (n.h - DROP.r) * c_;
        const fall = 1 - ease((t - .35) / .65), alpha = ease((t - .35) / .2) * (1 - ease((t - 8.5) / 1.5));
        if (alpha > 0) prims.push({ z, draw: ball([Pv[0] + x * fr.U[0], Pv[1] + y + .55 * fall * fall, Pv[2] + x * fr.U[2]], DROP.r, GOLD, '#b07d1d', alpha) });
      }
      continue;
    }
    if (n.kind === 'brass') prims.push({ z, draw: ball([Pv[0], Pv[1] - n.r, Pv[2]], n.r, BRASS, '#7a5a22', 1) });
    else if (n.kind === 'paper') prims.push({ z, draw: (x, sh) => {
      x.fillStyle = sh ? DEEP : n.color; x.beginPath();
      SHAPES[n.shape].forEach(([u, v], j) => { const q = at(fr, u * n.s, v * n.s); j ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1]); });
      x.closePath(); x.fill();
    } });
    else if (n.kind === 'glyph') prims.push({ z, draw: (x, sh) => {
      affine(x, fr, n.s / 100); x.font = '400 100px Literata'; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
      x.fillStyle = DEEP; x.fillText(n.ch, 0, 92); x.setTransform(1, 0, 0, 1, 0, 0);
    } });
    else prims.push({ z, draw: (x, sh) => {
      const img = plates[n.plate], w = n.w, h = n.hgt, front = (-fr.U[2]) * (cam[0] - fr.O[0]) + fr.U[0] * (cam[2] - fr.O[2]) > 0;
      const c0 = at(fr, -w / 2, 0), c1 = at(fr, w / 2, 0), c3 = at(fr, -w / 2, -h);
      if (sh) { const c2 = at(fr, w / 2, -h); x.fillStyle = DEEP; x.beginPath(); x.moveTo(...c0.slice(0, 2)); x.lineTo(...c1.slice(0, 2)); x.lineTo(...c2.slice(0, 2)); x.lineTo(...c3.slice(0, 2)); x.fill(); return; }
      const sw = img.width * w / h;
      x.setTransform((c1[0] - c0[0]) / sw, (c1[1] - c0[1]) / sw, (c3[0] - c0[0]) / img.height, (c3[1] - c0[1]) / img.height, c0[0], c0[1]);
      if (front) x.drawImage(img, (img.width - sw) / 2, 0, sw, img.height, 0, 0, sw, img.height);
      else { x.fillStyle = '#f2f0eb'; x.fillRect(0, 0, sw, img.height); x.strokeStyle = PALE; x.lineWidth = 14; x.strokeRect(60, 60, sw - 120, img.height - 120); }
      x.strokeStyle = DEEP; x.lineWidth = 10; x.strokeRect(0, 0, sw, img.height); x.setTransform(1, 0, 0, 1, 0, 0);
    } });
  }
  prims.sort((a, b) => b.z - a.z);

  g.drawImage(sheet.canvas, 0, 0);
  shadow.clearRect(0, 0, W, W);
  for (const pr of prims) { const k = near(pr.z); shadow.setTransform(1, 0, 0, 1, 10 + 16 * k, 16 + 22 * k); pr.draw(shadow, true); shadow.setTransform(1, 0, 0, 1, 0, 0); }
  g.save(); g.filter = 'blur(9px)'; g.globalAlpha = .28; g.globalCompositeOperation = 'multiply'; g.drawImage(shadow.canvas, 0, 0); g.restore();
  for (const pr of prims) pr.draw(g, false);
  g.save(); g.globalCompositeOperation = 'multiply'; g.drawImage(grain.canvas, 0, 0); g.restore();
};

(async () => {
  const load = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  [plates.pigeon, plates.penzias] = await Promise.all([load('../plates/pigeon_ink.png'), load('../plates/penzias_ink1.png'), document.fonts.load('400 100px Literata')]);
  window.render(0);
  window.ready = { duration: DUR };
})();
</script>
</body>
</html>
